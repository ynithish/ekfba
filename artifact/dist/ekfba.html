  $app.innerHTML = String(html`${h}${body}

function cardRow(c) {

  }

  const fr = packFreshness(pack, today());
  const offers = offersForCard(pack, card).sort((a, b) => (offerStatus(a, today()) === 'expired') - (offerStatus(b, today()) === 'expired'));
  const group = (title, items) => items.length ? html`<div class="rule-group"><h3>${title}</h3>${items}</div>` : '';
  const ruleBox = (r, title, sub, extra = '', cls = '') => html`<div class="rule ${cls}"><div class="rule-top"><strong>${title}</strong>${badges(r, extra)}</div>

      ${fr.unverifiedCount ? html`<span>${fr.unverifiedCount} unverified</span>` : ''}
      ${fr.offersStale ? html`<span>Offers may be out of date (${fr.ageDays} days old)</span>` : ''}</div>
    ${pack.card.variants?.length && card.variant && packMatchesCard(pack, card) === 'variant_mismatch' ? html`<div class="box warn">These rules are for ${pack.card.variants.join(', ')}; this card is ${card.variant}.</div>` : ''}
    ${group('Rewards', [
      ...(pack.earnRules || []).map((r) => ruleBox(r, r.label, [earnText(r, pack), scopeText(r.appliesTo),
        r.capPaise ? `cap ${formatPaise(r.capPaise)} ${PERIOD_LABEL[r.capPeriod]}` : r.capPoints ? `cap ${r.capPoints.toLocaleString('en-IN')} points ${PERIOD_LABEL[r.capPeriod]}` : ''].filter(Boolean).join(' · '))),
      ...(pack.exclusions || []).map((x) => ruleBox(x, x.label, `Excluded from ${x.excludedFrom.join(', ')} · ${scopeText(x.appliesTo)}`, html`<span class="pill st-quiet">Exclusion</span>`)),
    ])}
    ${group('Offers', offers.map((o) => ruleBox(o, o.label, [o.merchant, offerValueText(o)].filter(Boolean).join(' · '), offerPill(o), offerStatus(o, today()) === 'expired' ? 'expired' : '')))}
    ${group('Milestones', (pack.milestones || []).map((m) => ruleBox(m, m.label, `${formatPaise(m.thresholdPaise)} ${PERIOD_LABEL[m.period]} · ${m.benefit}${m.kind === 'fee_waiver' ? (m.feeReversal === 'auto' ? ' · reversed automatically' : ' · you must request it') : ''}`,
      html`<span class="pill st-info">${m.kind === 'fee_waiver' ? 'Fee waiver' : m.kind === 'lounge_unlock' ? 'Lounge' : 'Milestone'}</span>`)))}
    ${group('Lounge access', (pack.lounge || []).map((l) => ruleBox(l, l.label, `${l.unlimited ? `Unlimited ${l.scope} visits` : `${l.visits} ${l.scope} visit${l.visits === 1 ? '' : 's'} ${PERIOD_LABEL[l.period]}`}${l.requiresMilestoneId ? ' · needs the spend milestone above' : ''}`)))}
    ${group('Fees and charges', (pack.fees?.items || []).map((f) => ruleBox(f, f.label, scopeText(f.appliesTo))))}
    ${group('Other benefits', (pack.otherBenefits || []).map((b) => ruleBox(b, b.label, b.detail || '')))}
  </div>`;
}

/* ---------- Rule import + review ---------- */

function importPanel(card) {
  const rv = state.review;
  if (rv && rv.cardId === card.id && rv.ok) {
    const prev = activePack(card.id);
    const feeChange = rv.pack.fees && ['annualFeePaise', 'joiningFeePaise'].some((k) => rv.pack.fees[k] !== undefined && rv.pack.fees[k] !== card[k]);
    return html`<section class="panel" aria-label="Review rules">

      ${rv.match === 'mismatch' ? html`<div class="box bad">This pack is for <strong>${rv.pack.card.bank} ${rv.pack.card.name}</strong>, not ${card.bank} ${card.name}. Check you picked the right card.</div>` : ''}
      ${rv.match === 'variant_mismatch' ? html`<div class="box warn">This pack covers ${rv.pack.card.variants.join(', ')}; your card's variant is ${card.variant}. Variant-only offers will not apply.</div>` : ''}
      ${rv.warnings.length ? html`<div class="box warn"><strong>${rv.warnings.length} thing${rv.warnings.length === 1 ? '' : 's'} to check</strong><ul>${rv.warnings.slice(0, 8).map((w) => html`<li>${w.path}: ${w.message}</li>`)}</ul></div>` : ''}
      <div><div class="label">${prev ? `Changes from version ${prev.version}` : 'What will be added'}</div>

          <span><strong>${d.section}:</strong> ${d.label}${d.fields ? ' (' + d.fields.join(', ') + ')' : ''}${d.from !== undefined && d.id.endsWith('Paise') ? ` ${d.from == null ? '–' : formatPaise(d.from)} → ${d.to == null ? '–' : formatPaise(d.to)}` : ''}</span></li>`)}</ul>`
        : html`<p class="hint">No changes from the current version. Saving only records that the sources were checked again on ${fmtDate(rv.pack.checkedAt)}.</p>`}</div>
      ${feeChange ? html`<label class="actions"><input type="checkbox" id="apply-fees" checked> Update the card's fees to ${rupees(rv.pack.fees.annualFeePaise ?? card.annualFeePaise)} annual / ${rupees(rv.pack.fees.joiningFeePaise ?? card.joiningFeePaise)} joining</label>` : ''}
      <div class="actions"><button class="btn" data-action="approve" data-id="${card.id}" ${state.busy || rv.match === 'mismatch' ? 'disabled' : ''}>${state.busy ? 'Saving…' : 'Approve and save'}</button>
        <button class="btn ghost" data-action="back-to-paste">Back</button>
        <button class="btn ghost" data-action="cancel-import">Cancel</button></div>
    </section>`;
  }
  return html`<section class="panel" aria-label="Add rules">
    <h2>${activePack(card.id) ? 'Update rules' : 'Add rules'} for ${cardLabel(card)}</h2>
    <p class="hint">Paste the rule pack Claude made from this card's official pages, or choose the .json file. Nothing changes until you approve it.</p>
    <div class="field"><label for="pack-text">Rule pack (JSON)</label><textarea id="pack-text" class="code" spellcheck="false" placeholder='{ "format": "ekfba-rulepack", … }'>${state.review?.text || ''}</textarea></div>
    <div class="field"><label for="pack-file">Or choose a file</label><input id="pack-file" type="file" accept=".json,application/json"></div>
    ${rv && rv.cardId === card.id && !rv.ok && rv.errors.length ? html`<div class="box bad" role="alert"><strong>This rule pack can't be used yet.</strong><ul>${rv.errors.slice(0, 12).map((e) => html`<li>${e.path ? e.path + ': ' : ''}${e.message}</li>`)}</ul>${rv.errors.length > 12 ? html`<p>…and ${rv.errors.length - 12} more.</p>` : ''}</div>` : ''}
    <div class="actions"><button class="btn" data-action="check-pack" data-id="${card.id}">Check rules</button><button class="btn ghost" data-action="cancel-import">Cancel</button></div>
  </section>`;
}

function checkPack(cardId, text) {
  const card = state.cards.find((c) => c.id === cardId);
  let pack;
  try { pack = JSON.parse(text); } catch { state.review = { cardId, ok: false, text, errors: [{ path: '', message: 'This is not valid JSON. Copy the whole pack, from the first { to the last }.' }], warnings: [] }; return render(); }
  const v = validateRulePack(pack, today());
  if (!v.ok) { state.review = { cardId, ok: false, text, errors: v.errors, warnings: v.warnings }; return render(); }
  const prev = activePack(cardId);
  state.review = { cardId, ok: true, text, pack, warnings: v.warnings, match: packMatchesCard(pack, card), diff: diffRulePacks(prev ? prev.pack : null, pack) };
  render();
}

async function approvePack(cardId) {
  const rv = state.review;
  if (!rv?.ok || state.busy) return;
  const card = state.cards.find((c) => c.id === cardId);
  const prev = activePack(cardId);
  // Capture the versions to retire BEFORE writing: live updates can add the new version to state.packs mid-save.
  const toRetire = state.packs.filter((p) => p.cardId === cardId && p.status === 'active').map((p) => p.id);
  const nextVersion = Math.max(0, ...state.packs.filter((p) => p.cardId === cardId).map((p) => p.version || 0)) + 1;
  const applyFees = document.getElementById('apply-fees')?.checked;
  state.busy = true; render();
  try {
    const now = Date.now();
    const id = uuid();
    const rec = { id, cardId, version: nextVersion, status: 'active', pack: rv.pack, approvedAt: now, createdAt: now, updatedAt: now };
    await state.db.collection('rulePacks').doc(id).set(rec);
    for (const oldId of toRetire) {
      if (oldId === id) continue;
      await state.db.collection('rulePacks').doc(oldId).update({ status: 'superseded', updatedAt: Date.now() });
    }
    const update = { ...card, lastVerifiedAt: Date.parse(rv.pack.checkedAt + 'T00:00:00') };
    if (applyFees) {
      if (rv.pack.fees.annualFeePaise !== undefined) update.annualFeePaise = rv.pack.fees.annualFeePaise;
      if (rv.pack.fees.joiningFeePaise !== undefined) update.joiningFeePaise = rv.pack.fees.joiningFeePaise;
    }
    const r = await saveCard(update);
    if (!r.ok) throw new Error(Object.values(r.errors).join('; '));
    state.importing = null; state.review = null;
    toast(`Rules saved as version ${rec.version}`);
  } catch (e) { state.loadErr = e.code ? friendly(e) : e.message; }
  state.busy = false; render();
}

function readForm(form) {

  const dd = String(f.dueDay ?? '').trim();
  const base = state.editing === 'new' ? {} : state.cards.find((c) => c.id === state.editing) || {};
  return { ...base, kind: f.kind, bank: f.bank, name: f.name, network: f.network, nickname: f.nickname, last4: f.last4,
    holderName: f.holderName, holder: f.holder, joiningFeePaise: fee(f.joiningFee), annualFeePaise: fee(f.annualFee), issueDate: f.issueDate,
    statementDay: f.kind !== 'credit' || sd === '' ? null : (/^\d+$/.test(sd) ? Number(sd) : -1), dueDay: f.kind !== 'credit' || dd === '' ? null : (/^\d+$/.test(dd) ? Number(dd) : -1), sourceUrls: String(f.sourceUrls).split('\n'), notes: f.notes };

    ${d.recommendedCardId && d.cardId && d.recommendedCardId !== d.cardId ? html`<p class="hint">EKFBA suggested ${cardLabel(cardById(d.recommendedCardId) || { nickname: 'another card' })}; this records the card you actually used.</p>` : ''}
    ${state.logConfirmDelete ? html`<div class="box bad">Delete this purchase? It will be removed from your totals.
      <div class="actions" style="margin-top:8px"><button class="btn danger small" type="button" data-action="log-delete">Yes, delete</button><button class="btn ghost small" type="button" data-action="log-delete-no">Keep it</button></div></div>`
    : html`<div class="actions"><button class="btn" type="submit" ${state.busy ? 'disabled' : ''}>${state.busy ? 'Saving…' : 'Save purchase'}</button><button class="btn ghost" type="button" data-action="log-cancel">Cancel</button>
      ${d.id ? html`<button class="btn ghost small danger-text push-right" type="button" data-action="log-delete-ask">Delete</button>` : ''}</div>`}
  </form>`;
}

function renameBox(d) {
  if (!d.id) return '';
  const orig = allPurchases().find((p) => p.id === d.id);
  if (!orig) return '';
  const name = formatShopName(orig.merchant);
  const others = allPurchases().filter((p) => p.id !== d.id && formatShopName(p.merchant) === name).length;
  if (!others) return '';
  return html`<label class="check rename" id="rename-box" data-original="${name}" hidden><input type="checkbox" name="renameAll" checked> Also rename the ${others} other purchase${others === 1 ? '' : 's'} called “${name}”</label>`;
}

function billLine(c, ps, t) {
  const b = billingInfo(c, ps, t);
  if (!b) return '';
  const pay = b.payBy;
  const days = pay ? daysBetween(t, pay.date) : null;
  const items = [{ date: b.nextBill, node: html`<span>Next Bill ${fmtShort(b.nextBill)}</span>` }];
  if (pay) items.push({ date: pay.date, node: html`<span class="${days <= 3 ? 'due-soon' : ''}">Payment Date ${fmtShort(pay.date)}${pay.amountPaise ? ' (' + formatPaise(pay.amountPaise) + ' logged)' : ''}</span>` });
  items.sort((x, y) => x.date.localeCompare(y.date));
  return html`<div class="meta bill-line">${items.map((x, i) => html`${i ? ' · ' : ''}${x.node}`)}</div>`;
}

/** Category for a shop name: the one you used most recently for it, else the merchant directory's. */
function categoryForShop(raw) {
  const name = formatShopName(raw);
  if (!name) return null;
  const mine = allPurchases().find((p) => formatShopName(p.merchant) === name);
  if (mine) return mine.category;
  const m = MERCHANTS.find((x) => x.name === name);
  return m ? m.categories[0] : null;
}

function readLogForm() {
  const f = Object.fromEntries(new FormData(document.getElementById('log-form')));
  const money = (v, blank = null) => (String(v ?? '').trim() === '' ? blank : parseRupeesToPaise(v) ?? -1);
  const amountPaise = money(f.amount, null);
  const box = document.getElementById('rename-box');
  return { ...state.logDraft, merchant: f.merchant, amountPaise: amountPaise === null ? 0 : amountPaise, cardId: f.cardId, date: f.date, category: f.category,
    status: state.logDraft.status || 'completed', refundPaise: state.logDraft.refundPaise || 0,
    notes: f.notes, renameAll: !!box && !box.hidden && f.renameAll === 'on' };
}

async function deletePurchase() {
  const id = state.logDraft?.id;
  const existing = id ? allPurchases().find((p) => p.id === id) : null;
  if (!existing || state.busy || !state.db) return;
  state.busy = true; render();
  try {
    const k = monthKey(existing.date);
    const m = state.months.find((x) => x.id === k);
    await state.db.collection('purchaseMonths').doc(k).set({ ...m, id: k, purchases: (m.purchases || []).filter((x) => x.id !== id), updatedAt: Date.now() });
    state.logDraft = null; state.logConfirmDelete = false;
    toast(`Deleted: ${formatShopName(existing.merchant)} ${formatPaise(existing.amountPaise)}`);
  } catch (e) { state.logErrors = { _form: friendly(e) }; }
  state.busy = false; render();
}

async function savePurchase(confirmedDuplicate) {
  if (state.busy) return;
  const draft = readLogForm();
  draft.merchant = formatShopName(draft.merchant);
  const existing = draft.id ? allPurchases().find((p) => p.id === draft.id) : null;
  const r = validatePurchase({ ...draft, id: draft.id || uuid() }, existing);
  if (!r.ok) { state.logDraft = draft; state.logErrors = r.errors; return render(); }
  const p = r.purchase;
  const dups = findDuplicates(p, allPurchases());
  if (dups.length && !confirmedDuplicate) { state.logDraft = draft; state.logDup = dups; state.logErrors = {}; return render(); }
  if (!state.db) { state.logDraft = draft; state.logErrors = { _form: 'Saving is not available in this view.' }; return render(); }
  state.busy = true; state.logDraft = draft; render();
  try {
    const now = Date.now();
    const newKey = monthKey(p.date);
    const oldKey = existing ? monthKey(existing.date) : null;
    const monthDoc = (k) => state.months.find((m) => m.id === k);
    if (oldKey && oldKey !== newKey) {
      const old = monthDoc(oldKey);
      await state.db.collection('purchaseMonths').doc(oldKey).set({ ...old, purchases: (old.purchases || []).filter((x) => x.id !== p.id), updatedAt: now });
    }
    const cur = monthDoc(newKey);
    const list = (cur?.purchases || []).filter((x) => x.id !== p.id).concat(p);
    await state.db.collection('purchaseMonths').doc(newKey).set({ id: newKey, month: newKey, purchases: list, createdAt: cur?.createdAt || now, updatedAt: now });
    // Optional: correct the same shop name on every other purchase too.
    const oldName = existing ? formatShopName(existing.merchant) : null;
    if (draft.renameAll && oldName && oldName !== p.merchant) {
      for (const m of state.months) {
        const base = m.id === newKey ? list : (m.purchases || []);
        if (!base.some((x) => x.id !== p.id && formatShopName(x.merchant) === oldName)) continue;
        const fixed = base.map((x) => (x.id !== p.id && formatShopName(x.merchant) === oldName ? { ...x, merchant: p.merchant, updatedAt: now } : x));
        await state.db.collection('purchaseMonths').doc(m.id).set({ ...m, id: m.id, purchases: fixed, updatedAt: now });
      }
    }
    const card = cardById(p.cardId);
    state.logDraft = null; state.logErrors = {}; state.logDup = null;
    toast(existing ? 'Purchase updated' : `Saved: ${formatPaise(p.amountPaise)} on ${card ? cardLabel(card) : 'card'}`);
  } catch (e) { state.logErrors = { _form: friendly(e) }; }
  state.busy = false; render();
}

function spendsView() {
  const t = today();
  const range = periodContaining(state.spendPeriod === 'month' ? 'calendar_month' : state.spendPeriod === 'quarter' ? 'calendar_quarter' : 'calendar_year', t);
  const ps = allPurchases();
  const tot = totals(ps, range.start, range.end);
  const active = state.cards.filter((c) => c.status === 'active');
  const cardsShown = [...active, ...state.cards.filter((c) => c.status !== 'active' && tot.byCard[c.id])];
  const maxCard = Math.max(1, ...cardsShown.map((c) => tot.byCard[c.id] || 0));
  const cats = Object.entries(tot.byCategory).sort((a, b) => b[1] - a[1]);
  const maxCat = Math.max(1, ...cats.map((c) => c[1]));
  const list = ps.filter((p) => p.date >= range.start && p.date <= range.end && (!state.spendCard || p.cardId === state.spendCard) && (!state.spendCategory || p.category === state.spendCategory));
  const periodName = { month: new Date(t + 'T00:00:00').toLocaleDateString('en-IN', { month: 'long', year: 'numeric' }), quarter: `${fmtShort(range.start)} – ${fmtShort(range.end)}`, year: String(t.slice(0, 4)) }[state.spendPeriod];
  const pct = (v) => (tot.totalPaise ? Math.round((v * 100) / tot.totalPaise) : 0);

  const progress = active.map((c) => {
    const rec = activePack(c.id);
    if (!rec) return null;
    const items = milestoneProgress(c, rec.pack, ps, t);
    if (!items.length) return null;
    return html`<article class="row"><div class="detail flush">
      <div class="ins">${cardLabel(c)}</div>
      ${items.map((m) => m.missing ? html`<div class="ms"><div class="ms-top"><span>${m.milestone.label}</span></div><p class="hint">Add the card's ${m.missing === 'issueDate' ? 'issue date' : 'statement day'} to track this.</p></div>`
        : html`<div class="ms">
          <div class="ms-top"><span>${m.milestone.label}</span><span class="pill ${m.met ? 'st-ok' : 'st-quiet'}">${m.met ? 'Reached' : `${m.percent}%`}</span></div>
          <div class="bar" role="img" aria-label="${m.percent}% of ${formatPaise(m.milestone.thresholdPaise)}"><span style="width:${m.percent}%"></span></div>
          <div class="meta num">${formatPaise(m.eligiblePaise)} of ${formatPaise(m.milestone.thresholdPaise)}${m.met ? '' : ` · ${formatPaise(m.remainingPaise)} to go`} · ${fmtShort(m.period.start)} – ${fmtDate(m.period.end)}</div>
          ${m.milestone.kind === 'lounge_unlock' && m.previous ? html`<div class="meta">${m.previous.met ? 'Unlocked for now: last period reached ' + formatPaise(m.previous.eligiblePaise) + '.' : 'Not unlocked for now: last period logged ' + formatPaise(m.previous.eligiblePaise) + '.'}</div>` : ''}
        </div>`)}
    </div></article>`;
  }).filter(Boolean);

  return html`
    ${state.logDraft ? logForm() : ''}
    <div class="chips" role="group" aria-label="Period">${[['month', 'This month'], ['quarter', 'This quarter'], ['year', 'This year']].map(([k, l]) =>
      html`<button class="chip" data-action="spend-period" data-p="${k}" aria-pressed="${state.spendPeriod === k}">${l}</button>`)}</div>
    <section class="total">
      <div class="meta">${periodName}</div>
      <div class="total-n num">${formatPaise(tot.totalPaise)}</div>
      <div class="meta">${tot.count} purchase${tot.count === 1 ? '' : 's'}${tot.pendingPaise ? ` · ${formatPaise(tot.pendingPaise)} pending` : ''}</div>
    </section>
    <h2>By card</h2>
    ${active.length ? html`<section class="list">${cardsShown.map((c) => { const v = tot.byCard[c.id] || 0; return html`
      <button class="row spend-row ${state.spendCard === c.id ? 'selected' : ''}" data-action="spend-card" data-id="${c.id}" aria-pressed="${state.spendCard === c.id}">
        <div class="spend-top"><span class="ins">${cardLabel(c)}</span><span class="num">${formatPaise(v)}${v ? html` <small class="meta">${pct(v)}%</small>` : ''}</span></div>
        <div class="bar"><span style="width:${Math.round((v * 100) / maxCard)}%"></span></div>
        ${billLine(c, ps, t)}
      </button>`; })}</section>` : html`<div class="empty"><p>Add your cards in Cards first.</p></div>`}
    ${cats.length ? html`<h2>By category</h2><section class="panel plain cat-list">${cats.map(([k, v]) => html`
      <button class="cat-row ${state.spendCategory === k ? 'selected' : ''}" data-action="spend-cat" data-cat="${k}" aria-pressed="${state.spendCategory === k}"><span>${CAT_LABEL[k] || k}</span><div class="bar thin"><span style="width:${Math.round((v * 100) / maxCat)}%"></span></div><span class="num">${formatPaise(v)}</span></button>`)}</section>` : ''}
    ${progress.length ? html`<h2>Card milestones</h2><section class="list">${progress}</section>` : ''}
    <h2 id="purchases-h">Purchases</h2>
    ${state.spendCard || state.spendCategory ? html`<div class="chips filters">
      ${state.spendCard ? html`<button class="chip" aria-pressed="true" data-action="spend-card" data-id="${state.spendCard}">${cardLabel(cardById(state.spendCard) || {})} ✕</button>` : ''}
      ${state.spendCategory ? html`<button class="chip" aria-pressed="true" data-action="spend-cat" data-cat="${state.spendCategory}">${CAT_LABEL[state.spendCategory] || state.spendCategory} ✕</button>` : ''}
      <span class="meta">${list.length} purchase${list.length === 1 ? '' : 's'} · ${formatPaise(list.reduce((a, p) => a + netSpend(p), 0))} · tap one to change it</span></div>` : ''}
    ${!state.ready.months ? html`<div class="empty"><p>Loading purchases…</p></div>`
      : !list.length ? html`<div class="empty"><p>${ps.length ? 'No purchases in this period.' : 'No purchases logged yet. In Ask, tap “I paid with this card” after paying, or use Add purchase.'}</p></div>`
      : html`<section class="list">${list.slice(0, state.purchaseLimit).map((p) => { const c = cardById(p.cardId); const st = STATUS_PILL[p.status]; return html`
        <button class="row purchase" data-action="log-edit" data-id="${p.id}">
          <div><div class="ins">${formatShopName(p.merchant)}</div><div class="meta">${fmtShort(p.date)} · ${CAT_LABEL[p.category] || p.category} · ${c ? cardLabel(c) : 'Unknown card'}</div></div>
          <div class="right"><span class="num ${p.status === 'cancelled' ? 'strike' : ''}">${formatPaise(p.amountPaise)}</span>
            ${st ? html`<span class="pill ${st[0]}">${p.status === 'refunded' ? `Refunded ${formatPaise(p.refundPaise)}` : st[1]}</span>` : ''}</div>
        </button>`; })}</section>
        ${list.length > state.purchaseLimit ? html`<div class="actions center-actions"><button class="btn ghost" data-action="more-purchases">Show ${Math.min(10, list.length - state.purchaseLimit)} more <span class="meta">(${list.length - state.purchaseLimit} left)</span></button></div>` : ''}`}`;
}

function freshView() {
  const active = state.cards.filter((c) => c.status === 'active');
  if (!active.length) return html`<div class="empty"><p>Add cards to see how fresh their rules are.</p></div>`;
  return html`<p class="hint">Offers are marked out of date 30 days after the bank pages were last checked, other rules after 180 days. To refresh, share the card's pages in the Card Manager project chat and ask for an updated rule pack.</p>
    <section class="list">${active.map((c) => {
      const rec = activePack(c.id);
      if (!rec) return html`<article class="row"><div class="row-head"><div><div class="ins">${cardLabel(c)}</div><div class="meta">${c.sourceUrls.length} official link${c.sourceUrls.length === 1 ? '' : 's'} saved</div></div><div class="right"><span class="pill st-soon">No rules</span></div></div></article>`;
      const fr = packFreshness(rec.pack, today());
      const pill = fr.baselineStale ? ['st-urgent', 'Out of date'] : fr.offersStale ? ['st-soon', 'Offers out of date'] : ['st-ok', 'Fresh'];
      return html`<article class="row"><div class="row-head"><div><div class="ins">${cardLabel(c)}</div>
        <div class="meta">Checked ${fmtDate(rec.pack.checkedAt)} (${rel(-fr.ageDays)}) · version ${rec.version}${fr.unverifiedCount ? ` · ${fr.unverifiedCount} unverified` : ''}</div>
        <div class="meta">${rec.pack.sources.map((s, i) => html`${i ? ' · ' : ''}${s.url ? html`<a href="${s.url}" target="_blank" rel="noopener">${s.title}</a>` : s.title}`)}</div></div>
        <div class="right"><span class="pill ${pill[0]}">${pill[1]}</span></div></div></article>`;
    })}</section>`;
}

/* ---------------- Events ---------------- */

function afterRender() {
  document.getElementById('pack-file')?.addEventListener('change', async (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    if (file.size > 300000) { toast('That file is too large for a rule pack.'); return; }
    checkPack(state.importing, await file.text());
  });
  const shop = document.getElementById('l-merchant');
  const pickCategory = () => {
    const cat = categoryForShop(shop.value);
    const sel = document.getElementById('l-category');
    if (cat && sel && sel.value !== cat) { sel.value = cat; sel.classList.add('auto-filled'); setTimeout(() => sel.classList.remove('auto-filled'), 1200); }
  };
  shop?.addEventListener('change', pickCategory);
  shop?.addEventListener('input', () => { if (categoryForShop(shop.value)) pickCategory(); });
  const renameBoxEl = document.getElementById('rename-box');
  shop?.addEventListener('input', () => { if (renameBoxEl) renameBoxEl.hidden = formatShopName(shop.value) === renameBoxEl.dataset.original || !shop.value.trim(); });
  document.querySelectorAll('input[name=kind]').forEach((r) => r.addEventListener('change', () => {
    const cf = document.getElementById('credit-fields');
    if (cf) cf.hidden = document.querySelector('input[name=kind]:checked')?.value !== 'credit';
  }));
}

$app.addEventListener('click', async (ev) => {
  const t = ev.target.closest('[data-action]');
  if (!t || t.disabled) return;
  const a = t.dataset.action, id = t.dataset.id;
  if (a === 'tab') { state.tab = t.dataset.tab; render(); }
  else if (a === 'ask-try') runAsk(t.dataset.q);
  else if (a === 'ask-cat') runAsk(state.askText, t.dataset.cat);
  else if (a === 'new') { state.editing = 'new'; state.formDraft = {}; state.formErrors = {}; render(); document.getElementById('f-bank')?.focus(); }
  else if (a === 'edit') { state.editing = id; state.formDraft = { ...state.cards.find((c) => c.id === id) }; state.formErrors = {}; render(); document.getElementById('card-form')?.scrollIntoView({ block: 'start' }); }
  else if (a === 'cancel') { state.editing = null; state.formDraft = null; state.formErrors = {}; render(); }
  else if (a === 'toggle') { state.open = state.open === id ? null : id; state.confirm = null; if (state.importing !== state.open) { state.importing = null; state.review = null; } render(); }
  else if (a === 'toggle-archived') { state.showArchived = !state.showArchived; render(); }
  else if (a === 'ask') { state.confirm = { id, what: t.dataset.what }; render(); }
  else if (a === 'cancel-confirm') { state.confirm = null; render(); }
  else if (a === 'status' || a === 'replace') {
    const card = state.cards.find((c) => c.id === id);
    const status = a === 'replace' ? 'replaced' : t.dataset.status;
    const replacedById = a === 'replace' ? document.getElementById('replace-with').value : null;
    try {
      const r = await saveCard({ ...card, status, replacedById });
      if (r.ok) { state.confirm = null; toast(`Card ${STATUS_LABEL[status].toLowerCase()}`); }
    } catch (e) { state.loadErr = friendly(e); }
    render();
  }
  else if (a === 'import') { state.importing = id; state.review = null; render(); document.getElementById('pack-text')?.focus(); }
  else if (a === 'cancel-import') { state.importing = null; state.review = null; render(); }
  else if (a === 'check-pack') checkPack(id, document.getElementById('pack-text').value);
  else if (a === 'back-to-paste') { state.review = { cardId: state.review.cardId, ok: false, text: state.review.text, errors: [], warnings: [] }; render(); }
  else if (a === 'approve') approvePack(id);
  else if (a === 'log-new') openLog({ date: today(), cardId: state.spendCard || '', category: 'other', status: 'completed', source: 'manual' });
  else if (a === 'log-from-ask') logFromAsk(id);
  else if (a === 'log-edit') { const p = flattenMonths(state.months).find((x) => x.id === id); if (p) openLog({ ...p, merchant: formatShopName(p.merchant) }); }
  else if (a === 'log-cancel') { state.logDraft = null; state.logErrors = {}; state.logDup = null; state.logConfirmDelete = false; render(); }
  else if (a === 'log-delete-ask') { state.logDraft = readLogForm(); state.logConfirmDelete = true; render(); }
  else if (a === 'log-delete-no') { state.logConfirmDelete = false; render(); }
  else if (a === 'log-delete') deletePurchase();
  else if (a === 'log-save-anyway') savePurchase(true);
  else if (a === 'spend-period') { state.spendPeriod = t.dataset.p; state.purchaseLimit = 10; render(); }
  else if (a === 'spend-card') { state.spendCard = state.spendCard === id ? null : id; state.purchaseLimit = 10; render(); if (state.spendCard) document.getElementById('purchases-h')?.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
  else if (a === 'spend-cat') { const k = t.dataset.cat; state.spendCategory = state.spendCategory === k ? null : k; state.purchaseLimit = 10; render(); if (state.spendCategory) document.getElementById('purchases-h')?.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
  else if (a === 'more-purchases') { state.purchaseLimit += 10; render(); }
});

$app.addEventListener('submit', async (ev) => {
  if (ev.target.id === 'ask-form') { ev.preventDefault(); runAsk(document.getElementById('ask-q').value); return; }
  if (ev.target.id === 'log-form') { ev.preventDefault(); savePurchase(false); return; }
  if (ev.target.id !== 'card-form') return;
  ev.preventDefault();
  if (state.busy) return;
  const draft = readForm(ev.target);
  if (!state.db) { state.formDraft = draft; state.formErrors = { _form: 'Saving is not available in this view.' }; return render(); }
  state.busy = true;
  try {
    const r = await saveCard(draft);
    if (!r.ok) { state.formDraft = draft; state.formErrors = r.errors; }
    else { state.editing = null; state.formDraft = null; state.formErrors = {}; state.open = r.card.id; toast(draft.id ? 'Card updated' : 'Card added'); }
  } catch (e) { state.formDraft = draft; state.formErrors = { _form: friendly(e) }; }
  state.busy = false;
  render();
  document.querySelector('.ferr, #card-form .box.bad')?.scrollIntoView({ block: 'center' });
});

// Keep what the person is typing when live updates arrive.
function safeRender() {
  if (state.askResult && state.askText) { const wallet = state.cards.filter((c) => c.status === 'active').map((c) => ({ card: c, pack: activePack(c.id)?.pack || null })); const q = state.askResult.query; state.askResult = state.askResult.needs ? state.askResult : recommend(wallet, q, today()); }
  const f = document.activeElement;
  if (f && f.closest && (f.closest('#card-form') || f.closest('#log-form') || f.id === 'pack-text' || f.id === 'ask-q')) return;
  render();
}

render();

(async () => {
  if (!window.claude || !window.claude.use) { state.ready = { cards: true, rulePacks: true, months: true }; state.loadErr = 'Saving is not available in this view.'; return render(); }
  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  if (user) { try { const w = await user.can('data.write'); state.canWrite = w !== false; } catch (e) {} }
  if (!db) { state.ready = { cards: true, rulePacks: true, months: true }; state.loadErr = 'Sign in to claude.ai to see and save your cards.'; return render(); }
  state.db = db;
  render();
  db.collection('cards').onSnapshot((snap) => {
    state.cards = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
    state.ready.cards = true; state.loadErr = '';
    if (state.open && !state.cards.some((c) => c.id === state.open)) state.open = null;
    safeRender();
  }, () => { state.ready.cards = true; state.loadErr = 'Could not load your cards. Reopen the page to try again.'; render(); });
  db.collection('rulePacks').onSnapshot((snap) => {
    state.packs = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
    state.ready.rulePacks = true;
    safeRender();
  }, () => { state.ready.rulePacks = true; });
  db.collection('purchaseMonths').onSnapshot((snap) => {
    state.months = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
    state.ready.months = true;
    safeRender();
  }, () => { state.ready.months = true; state.loadErr = 'Could not load your purchases. Reopen the page to try again.'; render(); });
})();
</script>
