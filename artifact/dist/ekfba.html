const __m_ids = (() => {
// Identifier and time helpers. UUIDs make records safe to merge across devices later.

function uuid() {
  if (globalThis.crypto?.randomUUID) return globalThis.crypto.randomUUID();
  const b = new Uint8Array(16);
  globalThis.crypto.getRandomValues(b);
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map((x) => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}

function nowIso() {
  return new Date().toISOString();
}

/** Local calendar date "YYYY-MM-DD" (India users: dates are what the user sees on their phone). */
function todayLocal(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

return { uuid, nowIso, todayLocal };
})();

const __m_money = (() => {
// Money is always stored as an integer number of paise (₹1 = 100 paise).
// Never store or compute rupee amounts as floating-point numbers.

const PAISE_PER_RUPEE = 100;

/** Parse user input like "15,000", "₹1,50,000.50", "65k", "1.2L" into paise. Returns null if invalid. */
function parseRupeesToPaise(input) {
  if (typeof input === 'number') {
    if (!Number.isFinite(input) || input < 0) return null;
    return Math.round(input * PAISE_PER_RUPEE);
  }
  if (typeof input !== 'string') return null;
  let s = input.trim().toLowerCase().replace(/₹|rs\.?|inr|,|\s/g, '');
  if (!s) return null;
  let multiplier = 1;
  const suffix = s.match(/(k|l|lakh|lakhs|lac|cr|crore)$/);
  if (suffix) {
    const u = suffix[1];
    multiplier = u === 'k' ? 1e3 : (u === 'cr' || u === 'crore') ? 1e7 : 1e5;
    s = s.slice(0, -u.length);
  }
  if (!/^\d+(\.\d{1,2})?$/.test(s) && !(multiplier > 1 && /^\d+(\.\d+)?$/.test(s))) return null;
  const [whole, frac = ''] = s.split('.');
  // Exact integer arithmetic on the digit strings, avoiding float error.
  const fracPaiseDigits = (frac + '00').slice(0, 2);
  let paise = BigInt(whole) * 100n + BigInt(fracPaiseDigits);
  if (multiplier > 1) {
    // For suffixed values allow more decimals (e.g. 1.25L) and round to the paisa.
    const scale = 10n ** BigInt(frac.length);
    const units = BigInt(whole + frac);
    const num = units * BigInt(multiplier) * 100n;
    paise = (num + scale / 2n) / scale;
  }
  if (paise > BigInt(Number.MAX_SAFE_INTEGER)) return null;
  return Number(paise);
}

/** Format paise as Indian-grouped rupees: 23500000 -> "₹2,35,000". Shows paise only when non-zero. */
function formatPaise(paise, { showSign = false } = {}) {
  if (!Number.isInteger(paise)) throw new TypeError('formatPaise expects integer paise');
  const neg = paise < 0;
  const abs = Math.abs(paise);
  const rupees = Math.floor(abs / 100);
  const rem = abs % 100;
  const digits = String(rupees);
  let grouped;
  if (digits.length <= 3) grouped = digits;
  else {
    const last3 = digits.slice(-3);
    const rest = digits.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',');
    grouped = `${rest},${last3}`;
  }

  const sign = neg ? '−' : (showSign && paise > 0 ? '+' : '');

function percentOf(paise, basisPoints) {

/** Progress as a percentage with one decimal, capped to [0, 100]. */
function progressPercent(achieved, required) {
  if (required <= 0) return 100;
  const p = Math.floor((achieved * 1000) / required) / 10;
  return Math.max(0, Math.min(100, p));

})();

const __m_sensitive = (() => {
// Guards that stop sensitive card data from ever being stored.
// The app must never hold full card numbers, CVVs, PINs, OTPs or banking passwords.

function luhnValid(digits) {
  let sum = 0;
  let dbl = false;
  for (let i = digits.length - 1; i >= 0; i--) {
    let d = digits.charCodeAt(i) - 48;
    if (dbl) { d *= 2; if (d > 9) d -= 9; }
    sum += d;
    dbl = !dbl;
  }
  return sum % 10 === 0;

function findSensitiveData(text) {
  if (typeof text !== 'string' || !text) return null;
  // Runs of 12–19 digits, allowing spaces or dashes between groups (how card numbers are written).
  const runs = text.match(/\d(?:[ -]?\d){11,18}/g) || [];
  for (const run of runs) {
    const digits = run.replace(/[ -]/g, '');
    if (digits.length >= 13 && luhnValid(digits)) return 'looks like a full card number';
  }
  if (/\b(cvv|cvc|cvv2|card\s*verification)\b(?:\s*(?:is|no\.?|number))?\W{0,5}\d{3,4}\b/i.test(text)) return 'looks like a CVV';

  if (Array.isArray(value)) {
    for (let i = 0; i < value.length; i++) {

      if (hit) return hit;

    return null;

  if (value && typeof value === 'object') {
    for (const [k, v] of Object.entries(value)) {

  return null;
}

return { findSensitiveData, scanForSensitiveData, findExpiryDate };
})();

const __m_schema = (() => {
// Single source of truth for local database layout. Bump DB_VERSION and add a migration step
// whenever a store or index changes; never edit an existing migration.

const DB_NAME = 'ekfba';
const DB_VERSION = 2;
const SCHEMA_VERSION = 1; // schemaVersion of the credit_cards module backup envelope

/** store name -> { keyPath, indexes: [[name, keyPath, options]] } */
const STORES = {
  cards: { keyPath: 'id', indexes: [['status', 'status'], ['bank', 'bank']] },
  sources: { keyPath: 'id', indexes: [['cardId', 'cardId']] },
  ruleVersions: { keyPath: 'id', indexes: [['cardId', 'cardId']] },
  benefits: { keyPath: 'id', indexes: [['cardId', 'cardId'], ['ruleVersionId', 'ruleVersionId']] },
  offers: { keyPath: 'id', indexes: [['cardId', 'cardId'], ['validTo', 'validTo']] },
  milestones: { keyPath: 'id', indexes: [['cardId', 'cardId']] },
  transactionEvents: { keyPath: 'id', indexes: [['transactionId', 'transactionId'], ['cardId', 'cardId'], ['dedupeKey', 'dedupeKey']] },
  assessments: { keyPath: 'id', indexes: [['transactionId', 'transactionId'], ['milestoneId', 'milestoneId']] },
  reminders: { keyPath: 'id', indexes: [['dueDate', 'dueDate']] },
  outbox: { keyPath: 'id', indexes: [['createdAt', 'createdAt']] },
  settings: { keyPath: 'key', indexes: [] },
  rulePacks: { keyPath: 'id', indexes: [['cardId', 'cardId']] }, // added in DB v2
};

/** Ordered migrations: index i upgrades from version i to i+1. */
const MIGRATIONS = [
  // v0 -> v1: create every store above
  (db) => {
    for (const [name, def] of Object.entries(STORES)) {
      if (db.objectStoreNames.contains(name)) continue;
      const store = db.createObjectStore(name, { keyPath: def.keyPath });
      for (const [idx, path, opts] of def.indexes) store.createIndex(idx, path, opts || {});

  },
];

const BACKUP_STORES = Object.keys(STORES).filter((s) => s !== 'outbox');

return { DB_NAME, DB_VERSION, SCHEMA_VERSION, STORES, MIGRATIONS, BACKUP_STORES };
})();

  return t;
}
function offerValueText(o) {
  const v = o.benefitType.endsWith('_percent') ? `${o.valueBps / 100}%` : o.benefitType.endsWith('_flat') ? formatPaise(o.valuePaise) : `${o.valuePoints} bonus points`;
  const kind = o.benefitType.startsWith('instant') ? ' instant discount' : o.benefitType.startsWith('cashback') ? ' cashback' : '';
  const bits = [v + kind];
  if (o.maxBenefitPaise) bits.push(`up to ${formatPaise(o.maxBenefitPaise)}`);
  if (o.minSpendPaise) bits.push(`min spend ${formatPaise(o.minSpendPaise)}`);
  if (o.usageCap) bits.push(`${o.usageCap.count}× ${PERIOD_LABEL[o.usageCap.period] || ''}`);
  if (o.promoCode) bits.push(`code ${o.promoCode}`);
  return bits.join(' · ');
}
function offerPill(o) {
  const st = offerStatus(o, today());
  if (st === 'expired') return html`<span class="pill st-quiet">Expired ${fmtDate(o.validTo)}</span>`;
  if (st === 'upcoming') return html`<span class="pill st-info">Starts ${fmtDate(o.validFrom)}</span>`;
  if (st === 'no_end_date') return html`<span class="pill st-soon">End date unknown</span>`;
  const d = daysBetween(today(), o.validTo);
  return html`<span class="pill ${d <= 7 ? 'st-soon' : 'st-ok'}">${d === 0 ? 'Ends today' : `Ends ${fmtDate(o.validTo)}`}</span>`;
}

function rulesSection(card, rec) {

  const hist = packHistory(card.id);
  return html`<div class="rules">
    <div class="pack-meta"><span class="pill ${fr.offersStale ? 'st-soon' : 'st-ok'}">Checked ${fmtDate(pack.checkedAt)}</span>

    ${group('Rewards', [
      ...(pack.earnRules || []).map((r) => ruleBox(r, r.label, [earnText(r, pack), scopeText(r.appliesTo),
        r.capPaise ? `cap ${formatPaise(r.capPaise)} ${PERIOD_LABEL[r.capPeriod]}` : r.capPoints ? `cap ${r.capPoints.toLocaleString('en-IN')} points ${PERIOD_LABEL[r.capPeriod]}` : ''].filter(Boolean).join(' · '))),
      ...(pack.exclusions || []).map((x) => ruleBox(x, x.label, `Excluded from ${x.excludedFrom.join(', ')} · ${scopeText(x.appliesTo)}`, html`<span class="pill st-quiet">Exclusion</span>`)),
    ])}
    ${group('Offers', offers.map((o) => ruleBox(o, o.label, [o.merchant, offerValueText(o)].filter(Boolean).join(' · '), offerPill(o), offerStatus(o, today()) === 'expired' ? 'expired' : '')))}
    ${group('Milestones', (pack.milestones || []).map((m) => ruleBox(m, m.label, `${formatPaise(m.thresholdPaise)} ${PERIOD_LABEL[m.period]} · ${m.benefit}${m.kind === 'fee_waiver' ? (m.feeReversal === 'auto' ? ' · reversed automatically' : ' · you must request it') : ''}`,
      html`<span class="pill st-info">${m.kind === 'fee_waiver' ? 'Fee waiver' : m.kind === 'lounge_unlock' ? 'Lounge' : 'Milestone'}</span>`)))}
    ${group('Lounge access', (pack.lounge || []).map((l) => ruleBox(l, l.label, `${l.unlimited ? `Unlimited ${l.scope} visits` : `${l.visits} ${l.scope} visit${l.visits === 1 ? '' : 's'} ${PERIOD_LABEL[l.period]}`}${l.requiresMilestoneId ? ' · needs the spend milestone above' : ''}`)))}
    ${group('Fees and charges', (pack.fees?.items || []).map((f) => ruleBox(f, f.label, scopeText(f.appliesTo))))}

    <div class="field"><label for="pack-file">Or choose a file</label><input id="pack-file" type="file" accept=".json,application/json"></div>
    ${rv && rv.cardId === card.id && !rv.ok && rv.errors.length ? html`<div class="box bad" role="alert"><strong>This rule pack can't be used yet.</strong><ul>${rv.errors.slice(0, 12).map((e) => html`<li>${e.path ? e.path + ': ' : ''}${e.message}</li>`)}</ul>${rv.errors.length > 12 ? html`<p>…and ${rv.errors.length - 12} more.</p>` : ''}</div>` : ''}
    <div class="actions"><button class="btn" data-action="check-pack" data-id="${card.id}">Check rules</button><button class="btn ghost" data-action="cancel-import">Cancel</button></div>
  </section>`;
}

function checkPack(cardId, text) {
  const card = state.cards.find((c) => c.id === cardId);
  let pack;
  try { pack = JSON.parse(text); } catch { state.review = { cardId, ok: false, text, errors: [{ path: '', message: 'This is not valid JSON. Copy the whole pack, from the first { to the last }.' }], warnings: [] }; return render(); }
  const v = validateRulePack(pack, today());
  if (!v.ok) { state.review = { cardId, ok: false, text, errors: v.errors, warnings: v.warnings }; return render(); }
  const prev = activePack(cardId);
  state.review = { cardId, ok: true, text, pack, warnings: v.warnings, match: packMatchesCard(pack, card), diff: diffRulePacks(prev ? prev.pack : null, pack) };
  render();
}

async function approvePack(cardId) {
  const rv = state.review;
  if (!rv?.ok || state.busy) return;
  const card = state.cards.find((c) => c.id === cardId);
  const prev = activePack(cardId);
  // Capture the versions to retire BEFORE writing: live updates can add the new version to state.packs mid-save.
  const toRetire = state.packs.filter((p) => p.cardId === cardId && p.status === 'active').map((p) => p.id);
  const nextVersion = Math.max(0, ...state.packs.filter((p) => p.cardId === cardId).map((p) => p.version || 0)) + 1;
  const applyFees = document.getElementById('apply-fees')?.checked;
  state.busy = true; render();
  try {
    const now = Date.now();
    const id = uuid();
    const rec = { id, cardId, version: nextVersion, status: 'active', pack: rv.pack, approvedAt: now, createdAt: now, updatedAt: now };
    await state.db.collection('rulePacks').doc(id).set(rec);
    for (const oldId of toRetire) {
      if (oldId === id) continue;
      await state.db.collection('rulePacks').doc(oldId).update({ status: 'superseded', updatedAt: Date.now() });
    }
    const update = { ...card, lastVerifiedAt: Date.parse(rv.pack.checkedAt + 'T00:00:00') };
    if (applyFees) {
      if (rv.pack.fees.annualFeePaise !== undefined) update.annualFeePaise = rv.pack.fees.annualFeePaise;
      if (rv.pack.fees.joiningFeePaise !== undefined) update.joiningFeePaise = rv.pack.fees.joiningFeePaise;
    }
    const r = await saveCard(update);
    if (!r.ok) throw new Error(Object.values(r.errors).join('; '));
    state.importing = null; state.review = null;
    toast(`Rules saved as version ${rec.version}`);
  } catch (e) { state.loadErr = e.code ? friendly(e) : e.message; }
  state.busy = false; render();
}

function readForm(form) {
  const f = Object.fromEntries(new FormData(form));
  const fee = (v) => (String(v).trim() === '' ? null : parseRupeesToPaise(v) ?? -1);
  const sd = String(f.statementDay).trim();
  const base = state.editing === 'new' ? {} : state.cards.find((c) => c.id === state.editing) || {};
  return { ...base, kind: f.kind, bank: f.bank, name: f.name, variant: f.variant, network: f.network, nickname: f.nickname, last4: f.last4,
    holderName: f.holderName, holder: f.holder, joiningFeePaise: fee(f.joiningFee), annualFeePaise: fee(f.annualFee), issueDate: f.issueDate,
    statementDay: sd === '' ? null : (/^\d+$/.test(sd) ? Number(sd) : -1), sourceUrls: String(f.sourceUrls).split('\n'), notes: f.notes };
}

/* ---------- Offers ---------- */

function allOffers() {
  const out = [];
  for (const c of state.cards.filter((x) => x.status === 'active')) {
    const rec = activePack(c.id);
    if (!rec) continue;
    for (const o of offersForCard(rec.pack, c)) out.push({ o, card: c, pack: rec.pack });
  }
  return out;
}

function offersView() {
  const items = allOffers();
  const q = state.offerQuery.trim().toLowerCase();
  const f = state.offerFilter;
  const shown = items.filter(({ o, card }) => {
    const st = offerStatus(o, today());
    if (f === 'active' && !(st === 'active' || st === 'no_end_date')) return false;
    if (f === 'upcoming' && st !== 'upcoming') return false;
    if (f === 'expired' && st !== 'expired') return false;
    if (!q) return true;
    return [o.label, o.merchant, ...(o.appliesTo?.categories || []), card.bank, card.name, card.nickname].join(' ').toLowerCase().includes(q);
  }).sort((a, b) => (a.o.validTo || '9999').localeCompare(b.o.validTo || '9999'));
  const counts = { active: 0, upcoming: 0, expired: 0 };
  items.forEach(({ o }) => { const st = offerStatus(o, today()); counts[st === 'no_end_date' ? 'active' : st]++; });
  return html`
    <div class="field"><label for="offer-q">Search a shop, platform or category</label><input id="offer-q" type="search" value="${state.offerQuery}" placeholder="Croma, Swiggy, grocery…" autocomplete="off"></div>
    <div class="chips" role="group" aria-label="Offer status">
      ${[['active', `Active (${counts.active})`], ['upcoming', `Upcoming (${counts.upcoming})`], ['expired', `Expired (${counts.expired})`], ['all', 'All']].map(([k, l]) =>
        html`<button class="chip" data-action="offer-filter" data-f="${k}" aria-pressed="${f === k}">${l}</button>`)}
    </div>
    ${!items.length ? html`<div class="empty"><h2>No offers yet</h2><p>Offers appear here once you add rule packs to your cards. Each offer shows its card, conditions, end date and source.</p></div>`
      : !shown.length ? html`<div class="empty"><p>No ${f === 'all' ? '' : f + ' '}offers${q ? ` matching “${state.offerQuery}”` : ''}.</p></div>`
      : html`<section class="list" aria-label="Offers">${shown.map(({ o, card, pack }) => html`
        <article class="row"><div class="detail flush">
          <div class="rule-top"><div><div class="ins">${o.merchant || scopeText(o.appliesTo)}</div><div class="meta">${cardLabel(card)}</div></div>${badges(o, offerPill(o))}</div>

}

function exportJson() {
  const b = buildBackup({ cards: state.cards, rulePacks: state.packs }, APP_VERSION, COLLECTIONS);
  state.dl.save({ filename: `ekfba-cards-backup-${today()}.json`, data: JSON.stringify(b, null, 2) }).then(() => toast('Backup saved')).catch(() => {});
}
function exportCsv() {
  const q = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = [['Bank', 'Card', 'Variant', 'Type', 'Network', 'Nickname', 'Last 4', 'Card holder', 'Annual fee (Rs)', 'Issue date', 'Status', 'Rules checked'].map(q).join(',')];
  for (const c of state.cards) {
    const rec = activePack(c.id);
    rows.push([c.bank, c.name, c.variant, c.kind, c.network, c.nickname, c.last4, c.holderName, c.annualFeePaise == null ? '' : c.annualFeePaise / 100, c.issueDate, c.status, rec ? rec.pack.checkedAt : ''].map(q).join(','));
  }
  state.dl.save({ filename: 'ekfba-cards.csv', data: rows.join('\r\n') }).catch(() => {});
}
async function restore() {
  const p = state.backupPreview;
  if (!p?.ok || state.busy) return;
  state.busy = true; render();
  let added = 0, updated = 0;
  try {
    for (const name of COLLECTIONS) {
      const existing = name === 'cards' ? state.cards : state.packs;
      const m = mergeRecords(existing, p.stores[name] || []);
      const byId = new Map(existing.map((r) => [r.id, r]));
      for (const r of m.merged) {
        if (byId.get(r.id) === r) continue;
        await state.db.collection(name).doc(r.id).set(r);
      }
      added += m.added; updated += m.updated;
    }
    state.backupPreview = null;
    toast(`Restored: ${added} added, ${updated} updated`);
  } catch (e) { state.loadErr = friendly(e); }
  state.busy = false; render();
}

/* ---------------- Events ---------------- */

function afterRender() {
  document.getElementById('pack-file')?.addEventListener('change', async (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    if (file.size > 300000) { toast('That file is too large for a rule pack.'); return; }
    checkPack(state.importing, await file.text());
  });
  document.getElementById('backup-file')?.addEventListener('change', async (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    let obj;
    try { obj = JSON.parse(await file.text()); } catch { state.backupPreview = { ok: false, errors: ['The file is not valid JSON.'] }; return render(); }
    const v = validateBackup(obj, COLLECTIONS);
    state.backupPreview = { ...v, exportedAt: obj.exportedAt };
    render();
  });
  const q = document.getElementById('offer-q');
  q?.addEventListener('input', () => {
    state.offerQuery = q.value;
    const pos = q.selectionStart;
    render();
    const n = document.getElementById('offer-q'); n.focus(); n.setSelectionRange(pos, pos);
  });
}

$app.addEventListener('click', async (ev) => {
  const t = ev.target.closest('[data-action]');
  if (!t || t.disabled) return;
  const a = t.dataset.action, id = t.dataset.id;
  if (a === 'tab') { state.tab = t.dataset.tab; render(); }
  else if (a === 'new') { state.editing = 'new'; state.formDraft = {}; state.formErrors = {}; render(); document.getElementById('f-bank')?.focus(); }
  else if (a === 'edit') { state.editing = id; state.formDraft = { ...state.cards.find((c) => c.id === id) }; state.formErrors = {}; render(); document.getElementById('card-form')?.scrollIntoView({ block: 'start' }); }
  else if (a === 'cancel') { state.editing = null; state.formDraft = null; state.formErrors = {}; render(); }
  else if (a === 'toggle') { state.open = state.open === id ? null : id; state.confirm = null; if (state.importing !== state.open) { state.importing = null; state.review = null; } render(); }
  else if (a === 'toggle-archived') { state.showArchived = !state.showArchived; render(); }
  else if (a === 'ask') { state.confirm = { id, what: t.dataset.what }; render(); }
  else if (a === 'cancel-confirm') { state.confirm = null; render(); }
  else if (a === 'status' || a === 'replace') {
    const card = state.cards.find((c) => c.id === id);
    const status = a === 'replace' ? 'replaced' : t.dataset.status;
    const replacedById = a === 'replace' ? document.getElementById('replace-with').value : null;
    try {
      const r = await saveCard({ ...card, status, replacedById });
      if (r.ok) { state.confirm = null; toast(`Card ${STATUS_LABEL[status].toLowerCase()}`); }
    } catch (e) { state.loadErr = friendly(e); }
    render();
  }
  else if (a === 'import') { state.importing = id; state.review = null; render(); document.getElementById('pack-text')?.focus(); }
  else if (a === 'cancel-import') { state.importing = null; state.review = null; render(); }
  else if (a === 'check-pack') checkPack(id, document.getElementById('pack-text').value);
  else if (a === 'back-to-paste') { state.review = { cardId: state.review.cardId, ok: false, text: state.review.text, errors: [], warnings: [] }; render(); }
  else if (a === 'approve') approvePack(id);
  else if (a === 'offer-filter') { state.offerFilter = t.dataset.f; render(); }
  else if (a === 'export-json') exportJson();
  else if (a === 'export-csv') exportCsv();
  else if (a === 'restore') restore();
  else if (a === 'cancel-restore') { state.backupPreview = null; render(); }
});

$app.addEventListener('submit', async (ev) => {
  if (ev.target.id !== 'card-form') return;
  ev.preventDefault();
  if (state.busy) return;
  const draft = readForm(ev.target);
  if (!state.db) { state.formDraft = draft; state.formErrors = { _form: 'Saving is not available in this view.' }; return render(); }
  state.busy = true;
  try {
    const r = await saveCard(draft);
    if (!r.ok) { state.formDraft = draft; state.formErrors = r.errors; }
    else { state.editing = null; state.formDraft = null; state.formErrors = {}; state.open = r.card.id; toast(draft.id ? 'Card updated' : 'Card added'); }
  } catch (e) { state.formDraft = draft; state.formErrors = { _form: friendly(e) }; }
  state.busy = false;
  render();
  document.querySelector('.ferr, #card-form .box.bad')?.scrollIntoView({ block: 'center' });
});

// Keep what the person is typing when live updates arrive.
function safeRender() {
  const f = document.activeElement;
  if (f && f.closest && (f.closest('#card-form') || f.id === 'pack-text')) return;
  render();
}

render();

(async () => {
  if (!window.claude || !window.claude.use) { state.ready = { cards: true, rulePacks: true }; state.loadErr = 'Saving is not available in this view.'; return render(); }
  const [db, user, dl] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('downloads')]);
  state.dl = dl;
  if (user) { try { const w = await user.can('data.write'); state.canWrite = w !== false; } catch (e) {} }
  if (!db) { state.ready = { cards: true, rulePacks: true }; state.loadErr = 'Sign in to claude.ai to see and save your cards.'; return render(); }
  state.db = db;
  render();
  db.collection('cards').onSnapshot((snap) => {
    state.cards = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
    state.ready.cards = true; state.loadErr = '';
    if (state.open && !state.cards.some((c) => c.id === state.open)) state.open = null;
    safeRender();
  }, () => { state.ready.cards = true; state.loadErr = 'Could not load your cards. Reopen the page to try again.'; render(); });
  db.collection('rulePacks').onSnapshot((snap) => {
    state.packs = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
    state.ready.rulePacks = true;
    safeRender();
  }, () => { state.ready.rulePacks = true; });
})();
</script>
