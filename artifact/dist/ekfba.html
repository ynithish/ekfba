<title>EKFBA Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, phone first — same system as NLNLALD Policies. Tabs, summary strip, then expandable rows. */
:root {
  --bg: #f2f5fa;
  --surface: #ffffff;
  --ink: #0e1a2e;
  --muted: #566882;
  --line: #d9e1ec;
  --accent: #1a4fd6;
  --accent-ink: #ffffff;
  --accent-soft: #e6edfc;
  --ok: #1d6f46;
  --ok-bg: #e2f3e9;
  --soon: #8f5600;
  --soon-bg: #fcefd3;
  --urgent: #ae231b;
  --urgent-bg: #fce6e3;
  --quiet-bg: #e9edf3;
  --card-from: #1a2c55;
  --card-to: #0e1a2e;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1120; --surface: #131b2d; --ink: #e8eef8; --muted: #93a3bb; --line: #25314a;
    --accent: #7399ff; --accent-ink: #0b1120; --accent-soft: #1b2744;
    --ok: #75d6a1; --ok-bg: #12301f; --soon: #f3c168; --soon-bg: #33260a; --urgent: #ff9189; --urgent-bg: #3a1512;
    --quiet-bg: #1c263a; --card-from: #22386b; --card-to: #10192c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1120; --surface: #131b2d; --ink: #e8eef8; --muted: #93a3bb; --line: #25314a;
  --accent: #7399ff; --accent-ink: #0b1120; --accent-soft: #1b2744;
  --ok: #75d6a1; --ok-bg: #12301f; --soon: #f3c168; --soon-bg: #33260a; --urgent: #ff9189; --urgent-bg: #3a1512;
  --quiet-bg: #1c263a; --card-from: #22386b; --card-to: #10192c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 20px 40px; }
main { max-width: 680px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 26px; line-height: 1.1; letter-spacing: -0.01em; }
h2 { font-size: 17px; }
h3 { font-size: 15px; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); letter-spacing: .03em; }
.num { font-variant-numeric: tabular-nums; }

header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; min-height: 44px; padding: 0 18px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn.danger { background: var(--urgent); color: #fff; }
.btn.small { min-height: 38px; padding: 0 14px; font-size: 14px; }
.btn[disabled] { opacity: .5; cursor: default; }

.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; background: var(--quiet-bg); border-radius: 12px; }
.tab { border: 0; background: transparent; border-radius: 9px; min-height: 40px; font-weight: 600; font-size: 14px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 8%); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.stat b { display: block; font-family: var(--display); font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; }
button.stat { text-align: left; font: inherit; color: inherit; cursor: pointer; }
button.stat[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
button.stat.warn b { color: var(--soon); }
button.stat.good b { color: var(--ok); }
.stats.four { grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stats.four .stat { padding: 10px; display: flex; flex-direction: column; justify-content: flex-start; }
.stats.four .stat b { font-size: 24px; }
.stats.four .stat span { display: block; margin-top: 4px; font-size: 11.5px; line-height: 1.25; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; min-height: 36px; padding: 0 14px; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.list { display: flex; flex-direction: column; gap: 10px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.row.inactive { opacity: .7; }
.row-head { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left; background: none; border: 0; padding: 14px; min-height: 64px; }
.row-head > div { min-width: 0; }
.row-head > div:first-child { flex: 1; }
.lead-line { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mini-card { flex: none; width: 44px; height: 28px; border-radius: 5px; background: linear-gradient(135deg, var(--card-from), var(--card-to)); color: #fff; font-size: 9px; font-weight: 700; display: grid; place-items: end start; padding: 3px 5px; letter-spacing: .04em; }
.mini-card.other { background: var(--quiet-bg); color: var(--muted); place-items: center; font-size: 13px; }
.seg.seg3 { grid-template-columns: repeat(3, 1fr); }
.seg.seg3 span { font-size: 13px; padding: 9px 4px; }
.mini-card.debit { background: linear-gradient(135deg, #1d6f46, #0e3a26); }
.ins { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.right { text-align: right; flex: 0 0 auto; max-width: 42%; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.when { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.st-ok { background: var(--ok-bg); color: var(--ok); }
.st-soon { background: var(--soon-bg); color: var(--soon); }
.st-urgent { background: var(--urgent-bg); color: var(--urgent); }
.st-quiet { background: var(--quiet-bg); color: var(--muted); }
.st-info { background: var(--accent-soft); color: var(--accent); }
.detail.flush { border-top: 0; }
.detail { border-top: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 16px; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; margin: 0; }
.kv dt { color: var(--muted); font-size: 13px; }
.kv dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.rem { display: flex; flex-wrap: wrap; gap: 8px; }
.rem a, .rem span { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 13px; text-decoration: none; color: var(--accent); background: var(--accent-soft); }
.rem span { color: var(--muted); background: transparent; text-decoration: line-through; }
.label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.rules { display: flex; flex-direction: column; gap: 14px; }
.rule-group { display: flex; flex-direction: column; gap: 6px; }
.rule { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.rule-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.rule-top strong { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.rule-badges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; flex: none; max-width: 50%; }
.rule-badges.left { justify-content: flex-start; max-width: none; }
.rule small { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.rule .src { font-size: 12px; }
.rule.expired { opacity: .65; }
.pack-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 13px; color: var(--muted); }

.panel { background: var(--surface); border: 1px solid var(--accent); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel.plain { border-color: var(--line); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .field .flabel { font-size: 13px; color: var(--muted); }
.field input, .field select, .field textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; min-height: 44px; padding: 0 12px; width: 100%; font-size: 16px; }
.field textarea { padding: 10px 12px; min-height: 80px; resize: vertical; }
.field textarea.code { font-family: var(--mono); font-size: 13px; min-height: 160px; }
.field .ferr { color: var(--urgent); font-size: 13px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 10px; background: var(--quiet-bg); border: 0; margin: 0; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; }
.seg span { display: block; text-align: center; padding: 9px; border-radius: 8px; font-weight: 600; color: var(--muted); }
.seg input:checked + span { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 8%); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }
.err { color: var(--urgent); font-size: 13px; }
.box { border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.box ul { margin: 6px 0 0; padding-left: 18px; }
.box.bad { background: var(--urgent-bg); color: var(--urgent); }
.box.warn { background: var(--soon-bg); color: var(--soon); }
.box.good { background: var(--ok-bg); color: var(--ok); }
.box.info { background: var(--accent-soft); color: var(--ink); }
.diff { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.diff li { display: flex; gap: 8px; align-items: baseline; font-size: 14px; }
.diff li span:last-child { min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 460px) { .two { grid-template-columns: 1fr; } .kv { grid-template-columns: 1fr; gap: 0; } .kv dd { margin-bottom: 8px; } .tab { font-size: 13px; } }
.empty { text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 32px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty p { color: var(--muted); max-width: 42ch; }
.note { color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100vw - 32px); z-index: 10; }
.ask-form { display: flex; gap: 8px; }
.ask-form input { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-height: 52px; padding: 0 14px; font-size: 17px; }
.ask-form input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.ask-q { font-family: var(--display); font-size: 20px; line-height: 1.2; }
.winner { background: var(--surface); border: 2px solid var(--accent); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.winner .use { font-size: 13px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.winner .big { font-family: var(--display); font-size: 24px; line-height: 1.15; }
.save { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.save b { font-family: var(--display); font-size: 30px; color: var(--ok); font-variant-numeric: tabular-nums; }
.breakdown { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; margin: 0; }
.breakdown dt { color: var(--muted); }
.breakdown dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.why { font-size: 13.5px; color: var(--muted); }
.notes-list { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.alt-net { font-family: var(--display); font-size: 18px; font-variant-numeric: tabular-nums; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.total { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 2px; }
.total-n { font-family: var(--display); font-size: 36px; line-height: 1.1; }
.bar { height: 8px; border-radius: 99px; background: var(--quiet-bg); overflow: hidden; }
.bar.thin { height: 6px; }
.bar span { display: block; height: 100%; border-radius: 99px; background: var(--accent); min-width: 0; }
.spend-row, .purchase { width: 100%; text-align: left; padding: 12px 14px; display: flex; gap: 8px; cursor: pointer; }
.spend-row { flex-direction: column; }
.spend-row.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.spend-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.spend-top .ins { min-width: 0; overflow-wrap: anywhere; }
.purchase { justify-content: space-between; align-items: center; }
.purchase > div:first-child { min-width: 0; }
.check.rename { font-size: 13px; color: var(--accent); margin-top: -4px; }
.push-right { margin-left: auto; }
.danger-text { color: var(--urgent); }
.center-actions { justify-content: center; }
.bill-line { margin-top: 2px; }
.due-soon { color: var(--urgent); font-weight: 600; }
.strike { text-decoration: line-through; color: var(--muted); }
.cat-list { gap: 10px; }
.field select.auto-filled { border-color: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }
.cat-row { display: grid; grid-template-columns: minmax(90px, 1fr) 2fr auto; gap: 10px; align-items: center; font-size: 14px; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 10px; padding: 8px 10px; margin: -4px -10px; cursor: pointer; color: inherit; }
.cat-row:hover { background: var(--bg); }
.cat-row.selected { border-color: var(--accent); background: var(--accent-soft); }
.daily { gap: 8px; }
.day-stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; }
.day-stats b { font-weight: 600; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.days { display: flex; align-items: flex-end; gap: 2px; height: 96px; }
.day { flex: 1 1 0; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; background: none; border: 0; padding: 0; cursor: pointer; }
.day span { display: block; min-height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }
.day.zero span { background: var(--quiet-bg); }
.day.future { cursor: default; opacity: .35; }
.day.today span { box-shadow: 0 0 0 2px var(--accent-soft); }
.has-sel .day:not(.selected) span { opacity: .35; }
.day-axis { display: flex; gap: 2px; font-size: 10px; color: var(--muted); }
.day-axis span { flex: 1 1 0; min-width: 0; text-align: center; overflow: visible; white-space: nowrap; }
.day-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 600; color: var(--muted); padding: 10px 2px 0; }
.day-h:first-child { padding-top: 0; }
.veh-box { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 10px; background: var(--accent-soft); }
.seg.seg4 { grid-template-columns: repeat(4, 1fr); }
.seg.seg4 span { font-size: 13px; padding: 9px 4px; }
.doc-row { display: grid; grid-template-columns: 120px 1fr; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
.doc-row input[name^=durl] { grid-column: 1 / -1; }
.doc-row select, .doc-row input { min-height: 40px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; background: var(--bg); color: var(--ink); font: inherit; min-width: 0; }
.doc-row .ferr { grid-column: 1 / -1; }
.small-chips { margin-top: 6px; }
.small-chips .chip { min-height: 32px; font-size: 13px; }
.sub-box { display: flex; flex-direction: column; gap: 10px; }
.sub-pick { display: flex; flex-direction: column; gap: 10px; }
.inline-pair { display: grid; grid-template-columns: 90px 1fr; gap: 8px; }
.amc-fields { display: flex; flex-direction: column; gap: 12px; padding: 12px; border-radius: 10px; background: var(--accent-soft); }
.amc-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.group-label { margin: 2px 0 -4px; }
.sub-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; font: inherit; color: inherit; cursor: pointer; }
.sub-row > div { min-width: 0; }
.sub-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sub-totals { display: flex; gap: 14px; color: var(--ink); }
.sub-totals span { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; }
.sub-totals small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.sub-totals b { font-family: var(--display); font-size: 18px; font-weight: 700; }
.sub-totals .due-odd b { color: var(--soon); }
.due-odd-note { color: var(--soon); }
.two.three { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 460px) { .two.three { grid-template-columns: 1fr 1fr; } .two.three > :last-child { grid-column: 1 / -1; } }
.opt { color: var(--muted); font-weight: 400; }
.people-pick { border: 0; padding: 0; margin: 0; }
.people-pick legend { font-size: 13px; color: var(--muted); margin-bottom: 6px; padding: 0; }
.chip-check { position: relative; }
.chip-check input { position: absolute; opacity: 0; inset: 0; }
.chip-check span { display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; cursor: pointer; }
.chip-check input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip-check input:checked + span::before { content: '✓ '; white-space: pre; }
.chip-check input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.add-member { display: flex; gap: 8px; margin-top: 8px; }
.add-member input { flex: 1; min-width: 0; min-height: 40px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; background: var(--bg); color: var(--ink); font: inherit; font-size: 16px; }
.fam-name { color: var(--ink); }
.veh-row:has(.warn-note) { flex-wrap: wrap; }
.warn-note { color: var(--soon); flex-basis: 100%; }
.loan-out { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; flex: none; }
.loan-out small { font-size: 11.5px; font-weight: 400; }
details.opening summary { cursor: pointer; color: var(--accent); font-size: 14px; }
.paid-ok { color: var(--ok); font-weight: 600; }
.pay-hist { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.pay-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.pay-list li { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 6px 6px 12px; font-size: 14px; }
.pay-list li > span:first-child { flex: 1; min-width: 0; color: var(--muted); overflow-wrap: anywhere; }
.reorder-bar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: -6px; }
.acc.reordering .acc-head { grid-template-columns: 1fr auto; cursor: default; }
.move-btns { display: flex; gap: 6px; }
.move-btns .btn { min-width: 44px; font-size: 18px; }
.acc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.acc-head { width: 100%; display: grid; grid-template-columns: 1fr auto 20px; align-items: center; gap: 10px; padding: 14px 16px; background: none; border: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; min-height: 56px; }
.acc-title { font-family: var(--display); font-weight: 700; font-size: 17px; }
.acc-sum { color: var(--muted); font-size: 13px; text-align: right; }
.acc-sum.attn { color: var(--soon); font-weight: 600; }
.chev { width: 20px; height: 20px; color: var(--muted); transition: transform .15s; }
.acc.open .chev { transform: rotate(180deg); }

// Identifier and time helpers. UUIDs make records safe to merge across devices later.

function uuid() {
  if (globalThis.crypto?.randomUUID) return globalThis.crypto.randomUUID();
  const b = new Uint8Array(16);
  globalThis.crypto.getRandomValues(b);
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map((x) => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}

function nowIso() {
  return new Date().toISOString();
}

/** Local calendar date "YYYY-MM-DD" (India users: dates are what the user sees on their phone). */
function todayLocal(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

return { uuid, nowIso, todayLocal };
})();

const __m_money = (() => {
// Money is always stored as an integer number of paise (₹1 = 100 paise).
// Never store or compute rupee amounts as floating-point numbers.

const PAISE_PER_RUPEE = 100;

/** Parse user input like "15,000", "₹1,50,000.50", "65k", "1.2L" into paise. Returns null if invalid. */
function parseRupeesToPaise(input) {
  if (typeof input === 'number') {
    if (!Number.isFinite(input) || input < 0) return null;
    return Math.round(input * PAISE_PER_RUPEE);
  }
  if (typeof input !== 'string') return null;
  let s = input.trim().toLowerCase().replace(/₹|rs\.?|inr|,|\s/g, '');
  if (!s) return null;
  let multiplier = 1;
  const suffix = s.match(/(k|l|lakh|lakhs|lac|cr|crore)$/);
  if (suffix) {
    const u = suffix[1];
    multiplier = u === 'k' ? 1e3 : (u === 'cr' || u === 'crore') ? 1e7 : 1e5;
    s = s.slice(0, -u.length);
  }
  if (!/^\d+(\.\d{1,2})?$/.test(s) && !(multiplier > 1 && /^\d+(\.\d+)?$/.test(s))) return null;
  const [whole, frac = ''] = s.split('.');
  // Exact integer arithmetic on the digit strings, avoiding float error.
  const fracPaiseDigits = (frac + '00').slice(0, 2);
  let paise = BigInt(whole) * 100n + BigInt(fracPaiseDigits);
  if (multiplier > 1) {
    // For suffixed values allow more decimals (e.g. 1.25L) and round to the paisa.
    const scale = 10n ** BigInt(frac.length);
    const units = BigInt(whole + frac);
    const num = units * BigInt(multiplier) * 100n;
    paise = (num + scale / 2n) / scale;

  return Number(paise);

function formatPaise(paise, { showSign = false } = {}) {

  const neg = paise < 0;
  const abs = Math.abs(paise);
  const rupees = Math.floor(abs / 100);
  const rem = abs % 100;
  const digits = String(rupees);
  let grouped;
  if (digits.length <= 3) grouped = digits;
  else {
    const last3 = digits.slice(-3);
    const rest = digits.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',');
    grouped = `${rest},${last3}`;
  }

/** Progress as a percentage with one decimal, capped to [0, 100]. */
function progressPercent(achieved, required) {
  if (required <= 0) return 100;
  const p = Math.floor((achieved * 1000) / required) / 10;
  return Math.max(0, Math.min(100, p));

const __m_sensitive = (() => {
// Guards that stop sensitive card data from ever being stored.
// The app must never hold full card numbers, CVVs, PINs, OTPs or banking passwords.

function luhnValid(digits) {
  let sum = 0;
  let dbl = false;
  for (let i = digits.length - 1; i >= 0; i--) {
    let d = digits.charCodeAt(i) - 48;
    if (dbl) { d *= 2; if (d > 9) d -= 9; }
    sum += d;
    dbl = !dbl;
  }
  return sum % 10 === 0;
}

/** Returns a reason string if the text appears to contain sensitive card data, otherwise null. */
function findSensitiveData(text) {
  if (typeof text !== 'string' || !text) return null;
  // Runs of 12–19 digits, allowing spaces or dashes between groups (how card numbers are written).
  const runs = text.match(/\d(?:[ -]?\d){11,18}/g) || [];
  for (const run of runs) {
    const digits = run.replace(/[ -]/g, '');
    if (digits.length >= 13 && luhnValid(digits)) return 'looks like a full card number';
  }
  if (/\b(cvv|cvc|cvv2|card\s*verification)\b(?:\s*(?:is|no\.?|number))?\W{0,5}\d{3,4}\b/i.test(text)) return 'looks like a CVV';
  if (/\b(atm\s*pin|card\s*pin|pin)\b(?:\s*(?:is|no\.?|number))?\W{0,5}\d{4,6}\b/i.test(text)) return 'looks like a PIN';
  if (/\botp\b(?:\s*(?:is|code))?\W{0,5}\d{4,8}\b/i.test(text)) return 'looks like an OTP';
  if (/\bpass(?:word|code)\s*(?:is|:|=|-)\s*\S{4,}/i.test(text)) return 'looks like a password';
  return null;

 * Walks any object/array and returns the first sensitive finding as {path, reason}, or null.
 * `exemptKeys` lists fields whose free text may legitimately hold long numbers (e.g. order references);
 * the forbidden-field-name check still applies to them.

function scanForSensitiveData(value, path = '', exemptKeys = ['orderRef', 'transactionRef', 'contentHash', 'id']) {
  const leaf = path.split('.').pop()?.replace(/\[\d+\]$/, '');
  if (typeof value === 'string' && exemptKeys.includes(leaf)) return null;
  if (typeof value === 'string') {
    const reason = findSensitiveData(value);
    return reason ? { path: path || '(value)', reason } : null;
  }
  if (Array.isArray(value)) {
    for (let i = 0; i < value.length; i++) {
      const hit = scanForSensitiveData(value[i], `${path}[${i}]`, exemptKeys);
      if (hit) return hit;
    }
    return null;
  }
  if (value && typeof value === 'object') {
    for (const [k, v] of Object.entries(value)) {
      if (/^(cvv|cvc|pin|otp|password|cardNumber|pan)$/i.test(k) && v != null && v !== '') {
        return { path: path ? `${path}.${k}` : k, reason: `field "${k}" is not allowed` };
      }
      const hit = scanForSensitiveData(v, path ? `${path}.${k}` : k, exemptKeys);
      if (hit) return hit;
    }
  }
  return null;
}

/** Returns a reason if the text looks like a card expiry date (e.g. "exp 08/29", "valid thru 08/2029"). */
function findExpiryDate(text) {
  if (typeof text !== 'string') return null;
  if (/\b(exp|expiry|expires|valid\s*thru|valid\s*through|good\s*thru)\b\W{0,6}(0[1-9]|1[0-2])\s*[/-]\s*(\d{2}|\d{4})\b/i.test(text)) return 'looks like a card expiry date';
  return null;
}

return { findSensitiveData, scanForSensitiveData, findExpiryDate };
})();

const __m_schema = (() => {
// Single source of truth for local database layout. Bump DB_VERSION and add a migration step
// whenever a store or index changes; never edit an existing migration.

const DB_NAME = 'ekfba';
const DB_VERSION = 2;
const SCHEMA_VERSION = 1; // schemaVersion of the credit_cards module backup envelope

/** store name -> { keyPath, indexes: [[name, keyPath, options]] } */
const STORES = {
  cards: { keyPath: 'id', indexes: [['status', 'status'], ['bank', 'bank']] },
  sources: { keyPath: 'id', indexes: [['cardId', 'cardId']] },
  ruleVersions: { keyPath: 'id', indexes: [['cardId', 'cardId']] },
  benefits: { keyPath: 'id', indexes: [['cardId', 'cardId'], ['ruleVersionId', 'ruleVersionId']] },
  offers: { keyPath: 'id', indexes: [['cardId', 'cardId'], ['validTo', 'validTo']] },
  milestones: { keyPath: 'id', indexes: [['cardId', 'cardId']] },
  transactionEvents: { keyPath: 'id', indexes: [['transactionId', 'transactionId'], ['cardId', 'cardId'], ['dedupeKey', 'dedupeKey']] },
  assessments: { keyPath: 'id', indexes: [['transactionId', 'transactionId'], ['milestoneId', 'milestoneId']] },
  reminders: { keyPath: 'id', indexes: [['dueDate', 'dueDate']] },
  outbox: { keyPath: 'id', indexes: [['createdAt', 'createdAt']] },
  settings: { keyPath: 'key', indexes: [] },
  rulePacks: { keyPath: 'id', indexes: [['cardId', 'cardId']] }, // added in DB v2
};

/** Ordered migrations: index i upgrades from version i to i+1. */
const MIGRATIONS = [
  // v0 -> v1: create every store above
  (db) => {
    for (const [name, def] of Object.entries(STORES)) {
      if (db.objectStoreNames.contains(name)) continue;
      const store = db.createObjectStore(name, { keyPath: def.keyPath });
      for (const [idx, path, opts] of def.indexes) store.createIndex(idx, path, opts || {});
    }
  },
  // v1 -> v2: approved rule-pack versions (Phase 2)
  (db) => {
    if (!db.objectStoreNames.contains('rulePacks')) db.createObjectStore('rulePacks', { keyPath: 'id' }).createIndex('cardId', 'cardId');
  },
];

/** Stores included in a backup. The outbox is device-local and is never exported. */
const BACKUP_STORES = Object.keys(STORES).filter((s) => s !== 'outbox');

return { DB_NAME, DB_VERSION, SCHEMA_VERSION, STORES, MIGRATIONS, BACKUP_STORES };
})();

const __m_card = (() => {
// Card model: validation and normalisation for wallet cards.
// Benefit and offer rules are NOT stored on the card; they live in versioned rule records (Phase 2).

const { scanForSensitiveData, findExpiryDate } = __m_sensitive;
const { uuid } = __m_ids;
const CARD_KINDS = ['credit', 'debit', 'other']; // other = bank transfer, UPI, cash and similar
const NETWORKS = ['Visa', 'Mastercard', 'RuPay', 'American Express', 'Other'];
const HOLDER_TYPES = ['primary', 'add-on'];

const trim = (v) => (typeof v === 'string' ? v.trim() : v);

/**
 * Validates a card draft. Returns { ok: true, card } with a normalised record, or { ok: false, errors: {field: message} }.
 * `existing` is the stored record when editing, so ids, timestamps and version are preserved.
 */
function validateCard(draft, existing = null) {
  const errors = {};
  const c = {
    bank: trim(draft.bank) || '',
    name: trim(draft.name) || '',
    kind: draft.kind,
    network: draft.network,
    variant: trim(draft.variant) || '',
    tier: trim(draft.tier) || '',
    holder: draft.holder || 'primary',
    holderName: trim(draft.holderName) || '',
    nickname: trim(draft.nickname) || '',
    last4: trim(draft.last4) || '',
    joiningFeePaise: draft.joiningFeePaise ?? null,
    annualFeePaise: draft.annualFeePaise ?? null,
    issueDate: trim(draft.issueDate) || '',
    statementDay: draft.statementDay ?? null,
    dueDay: draft.dueDay ?? null,
    status: draft.status || 'active',
    replacedById: draft.replacedById || null,
    sourceUrls: (draft.sourceUrls || []).map(trim).filter(Boolean),
    notes: trim(draft.notes) || '',

  if (!c.name) errors.name = isCard ? 'Card name is required' : 'Give it a name, for example UPI or Bank transfer';
  if (!CARD_KINDS.includes(c.kind)) errors.kind = 'Choose credit card, debit card or bank transfer / other';
  if (!NETWORKS.includes(c.network)) errors.network = 'Choose a card network';
  if (!HOLDER_TYPES.includes(c.holder)) errors.holder = 'Invalid holder type';
  if (!CARD_STATUSES.includes(c.status)) errors.status = 'Invalid status';

  if (isCard && !c.last4 && !c.nickname) errors.nickname = 'Give a nickname or the last 4 digits so you can tell cards apart';
  if (c.nickname.length > 40) errors.nickname = 'Keep the nickname under 40 characters';
  if (c.holderName.length > 60) errors.holderName = 'Keep the name under 60 characters';
  if (!isPaise(c.joiningFeePaise)) errors.joiningFeePaise = 'Invalid amount';
  if (!isPaise(c.annualFeePaise)) errors.annualFeePaise = 'Invalid amount';
  if (c.issueDate && !isDate(c.issueDate)) errors.issueDate = 'Use a valid date';
  if (c.statementDay !== null && !(Number.isInteger(c.statementDay) && c.statementDay >= 1 && c.statementDay <= 31)) {
    errors.statementDay = 'Statement day must be 1–31';
  }
  if (c.dueDay !== null && !(Number.isInteger(c.dueDay) && c.dueDay >= 1 && c.dueDay <= 31)) {

  const sensitive = scanForSensitiveData(c);
  if (sensitive) errors[sensitive.path] = `Not saved: ${sensitive.reason}. Never store full card numbers, expiry dates, CVV, PIN or OTP.`;
  for (const f of ['nickname', 'notes', 'variant', 'name']) {
    const e = findExpiryDate(c[f]);

  const ts = Date.now(); // milliseconds, same convention as the NLNLALD modules
  return {
    ok: true,
    card: {
      ...c,
      id: existing?.id || draft.id || uuid(),
      createdAt: existing?.createdAt || draft.createdAt || ts,
      updatedAt: ts,
      version: (existing?.version || 0) + 1,

})();

const __m_backup = (() => {
// Backup file format (pure logic, no storage access): build, validate and merge snapshots.

const { BACKUP_STORES, SCHEMA_VERSION } = __m_schema;
const { validateCard } = __m_card;
const { scanForSensitiveData } = __m_sensitive;
const { nowIso } = __m_ids;
// Envelope shared by every NLNLALD module: { app, module, schemaVersion, exportedAt, records[] }.
// records = cards. Other collections travel in `collections` so importers that only read records still work.
const BACKUP_APP = 'NLNLALD';
const BACKUP_MODULE = 'credit_cards';

/** data: { storeName: record[] } */
function buildBackup(data, appVersion, storeNames = BACKUP_STORES) {
  const collections = {};
  for (const s of storeNames) if (s !== 'cards') collections[s] = Array.isArray(data[s]) ? data[s] : [];
  return {
    app: BACKUP_APP, module: BACKUP_MODULE, schemaVersion: SCHEMA_VERSION, appVersion,
    exportedAt: nowIso(), records: Array.isArray(data.cards) ? data.cards : [], collections,
  };
}

/**
 * Validates a parsed backup object. Returns { ok, stores, summary, errors }.
 * Every card is re-validated; the whole file is scanned for sensitive data.
 */
function validateBackup(obj, storeNames = BACKUP_STORES) {
  const errors = [];
  if (!obj || obj.app !== BACKUP_APP || obj.module !== BACKUP_MODULE || !Array.isArray(obj.records)) {
    return { ok: false, errors: [obj?.app === BACKUP_APP && obj?.module ? `This is a backup of the ${obj.module} module, not credit cards.` : 'This is not an EKFBA card backup file.'] };
  }
  const input = { cards: obj.records, ...(obj.collections || {}) };
  if (!Number.isInteger(obj.schemaVersion) || obj.schemaVersion > SCHEMA_VERSION) {
    return { ok: false, errors: [`Backup was made by a newer version of the app (format ${obj.schemaVersion}). Update the app first.`] };
  }
  const sensitive = scanForSensitiveData(input);
  if (sensitive) return { ok: false, errors: [`Refused: ${sensitive.path} ${sensitive.reason}.`] };

  const stores = {};
  for (const s of storeNames) {
    const rows = input[s] ?? [];
    if (!Array.isArray(rows)) { errors.push(`"${s}" is not a list`); continue; }
    stores[s] = [];
    const seen = new Set();
    rows.forEach((row, i) => {
      const key = s === 'settings' ? row?.key : row?.id;
      if (!key || typeof key !== 'string') { errors.push(`${s}[${i}] has no id`); return; }
      if (seen.has(key)) { errors.push(`${s}[${i}] duplicate id ${key}`); return; }
      seen.add(key);
      if (s === 'cards') {
        const r = validateCard(row);
        if (!r.ok) { errors.push(`Card "${row.nickname || row.name || key}": ${Object.values(r.errors).join('; ')}`); return; }
        stores[s].push({ ...r.card, id: row.id, createdAt: row.createdAt, updatedAt: row.updatedAt, version: row.version });
      } else {
        stores[s].push(row);
      }
    });
  }
  const summary = Object.fromEntries(Object.entries(stores).map(([k, v]) => [k, v.length]));
  return { ok: errors.length === 0, stores, summary, errors };
}

/**
 * Merges incoming records into existing ones by id. The record with the later updatedAt wins;
 * ties keep the existing record. Returns { merged, added, updated, unchanged }.
 */
const stamp = (v) => (typeof v === 'number' ? v : Date.parse(v || '') || 0);

function mergeRecords(existing, incoming, key = 'id') {
  const map = new Map(existing.map((r) => [r[key], r]));
  let added = 0, updated = 0, unchanged = 0;
  for (const r of incoming) {
    const cur = map.get(r[key]);
    if (!cur) { map.set(r[key], r); added++; }
    else if (stamp(r.updatedAt) > stamp(cur.updatedAt)) { map.set(r[key], r); updated++; }
    else unchanged++;
  }
  return { merged: [...map.values()], added, updated, unchanged };
}

return { BACKUP_APP, BACKUP_MODULE, buildBackup, validateBackup, mergeRecords };
})();

const RULEPACK_FORMAT = 'ekfba-rulepack';

const { formatShopName } = __m_merchants;

];

const CUSTOM_MAX = { days: 730, months: 60 };
const PERIOD_LABEL = Object.fromEntries(SUBSCRIPTION_PERIODS);
const DAYS = { '28d': 28, '56d': 56, '84d': 84 };
const MONTHS = { monthly: 1, quarterly: 3, halfyearly: 6, yearly: 12 };

const pad = (n) => String(n).padStart(2, '0');
const lastDay = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();

/** "Every 7 months", "Every 45 days", "Monthly"… for a subscription object (or a period key). */
function subscriptionLabel(sub) {
  const s = typeof sub === 'string' ? { every: sub } : (sub || {});
  if (s.every === 'custom') return `Every ${s.count} ${s.count === 1 ? s.unit.replace(/s$/, '') : s.unit}`;
  return PERIOD_LABEL[s.every] || '';
}

/** The date one period after `date` (month periods keep the day, capped at the month's last day).
 *  `every` is a period key or a subscription object (custom periods use { every: 'custom', count, unit }). */
function nextDueDate(date, every) {
  const s = typeof every === 'string' ? { every } : (every || {});
  const days = s.every === 'custom' ? (s.unit === 'days' ? s.count : 0) : DAYS[s.every];
  if (days) return new Date(Date.parse(date + 'T00:00:00Z') + days * 86400000).toISOString().slice(0, 10);
  const add = s.every === 'custom' ? (s.unit === 'months' ? s.count : 0) : MONTHS[s.every];
  if (!add) return null;
  let [y, m, d] = date.split('-').map(Number);
  m += add; while (m > 12) { m -= 12; y++; }
  return `${y}-${pad(m)}-${pad(Math.min(d, lastDay(y, m)))}`;

function normaliseSubscription(s) {
  if (!s || !s.every) return null;
  if (!PERIOD_LABEL[s.every]) return undefined;

    const count = Number(s.count);

    out.count = count; out.unit = s.unit;

 * One entry per subscription (same shop name, linked item and period), from its latest purchase:

 * Cancelled purchases are ignored.

 * paid = subscription purchases dated this month (cancelled/pending excluded, refunds netted).
 * due  = every payment still expected up to the month end, from each subscription's next due date

/* ---------------- Data access ---------------- */

function activePack(cardId) {
  const list = state.packs.filter((p) => p.cardId === cardId);
  const active = list.filter((p) => p.status === 'active').sort((a, b) => b.version - a.version);
  return active[0] || null; // if a save was interrupted, the highest active version wins
}
const packHistory = (cardId) => state.packs.filter((p) => p.cardId === cardId).sort((a, b) => b.version - a.version);

function friendly(e) {
  const c = e && e.code;
  if (c === 'invalid_argument' || c === 'not_granted') return 'You do not have permission to change this wallet.';
  if (c === 'quota_exceeded') return 'This page has reached its storage limit.';
  if (c === 'resource_exhausted' || c === 'unavailable') return 'Too busy right now. Try again in a moment.';
  return 'Could not save. Check your connection and try again.';
}

async function saveCard(draft) {
  const existing = draft.id ? state.cards.find((c) => c.id === draft.id) : null;
  const r = validateCard(draft, existing);
  if (!r.ok) return r;
  await state.db.collection('cards').doc(r.card.id).set(r.card);
  return r;
}

function feeInfo(card) {

  const due = nextAnniversary(card.issueDate, today());

}

/* ---------- Rules display ---------- */

function badges(rule, extra = '') {
  return html`<span class="rule-badges">${extra}${rule.verified === false ? html`<span class="pill st-soon">Unverified</span>` : ''}</span>`;
}
function sourceLine(pack, rule) {
  const s = (pack.sources || []).find((x) => x.id === rule.sourceId);
  if (!s) return '';
  return html`<small class="src">Source: ${s.url ? html`<a href="${s.url}" target="_blank" rel="noopener">${s.title}</a>` : s.title + (s.document ? ' (' + s.document + ')' : '')}</small>`;
}
function scopeText(a) {
  if (!a) return '';
  const parts = [];
  if (a.merchants?.length) parts.push(a.merchants.join(', '));
  if (a.categories?.length) parts.push(a.categories.map((c) => CAT_LABEL[c] || c).join(', '));
  if (a.channel && a.channel !== 'any') parts.push(a.channel);
  return parts.join(' · ');
}
function earnText(r, pack) {
  if (r.kind === 'cashback') return `${(r.rateBps / 100).toFixed(2).replace(/\.?0+$/, '')}% cashback`;
  const pp = r.pointsPer;
  let t = `${pp.points} point${pp.points === 1 ? '' : 's'} per ${formatPaise(pp.perPaise)}`;
  if (pack.pointValue) {
    const eff = (pp.points * pack.pointValue.paisePerPoint * 100) / pp.perPaise;
    t += ` ≈ ${eff.toFixed(2)}% back at ${pack.pointValue.paisePerPoint} paise a point${pack.pointValue.verified === false ? ' (unverified value)' : ''}`;
  }
  return t;
}
function offerValueText(o) {
  const v = o.benefitType.endsWith('_percent') ? `${o.valueBps / 100}%` : o.benefitType.endsWith('_flat') ? formatPaise(o.valuePaise) : `${o.valuePoints} bonus points`;
  const kind = o.benefitType.startsWith('instant') ? ' instant discount' : o.benefitType.startsWith('cashback') ? ' cashback' : '';
  const bits = [v + kind];
  if (o.maxBenefitPaise) bits.push(`up to ${formatPaise(o.maxBenefitPaise)}`);
  if (o.minSpendPaise) bits.push(`min spend ${formatPaise(o.minSpendPaise)}`);
  if (o.usageCap) bits.push(`${o.usageCap.count}× ${PERIOD_LABEL[o.usageCap.period] || ''}`);
  if (o.promoCode) bits.push(`code ${o.promoCode}`);
  return bits.join(' · ');
}
function offerPill(o) {
  const st = offerStatus(o, today());
  if (st === 'expired') return html`<span class="pill st-quiet">Expired ${fmtDate(o.validTo)}</span>`;
  if (st === 'upcoming') return html`<span class="pill st-info">Starts ${fmtDate(o.validFrom)}</span>`;
  if (st === 'no_end_date') return html`<span class="pill st-soon">End date unknown</span>`;
  const d = daysBetween(today(), o.validTo);
  return html`<span class="pill ${d <= 7 ? 'st-soon' : 'st-ok'}">${d === 0 ? 'Ends today' : `Ends ${fmtDate(o.validTo)}`}</span>`;
}

function rulesSection(card, rec) {
  if (!rec) {
    return html`<div class="box warn"><strong>No verified rules for this card yet.</strong> Share its official benefits page or terms PDF in the Card Manager project chat and ask for a rule pack, then tap <em>Add rules</em> and paste it.</div>`;
  }
  const pack = rec.pack;
  const fr = packFreshness(pack, today());
  const offers = offersForCard(pack, card).sort((a, b) => (offerStatus(a, today()) === 'expired') - (offerStatus(b, today()) === 'expired'));
  const group = (title, items) => items.length ? html`<div class="rule-group"><h3>${title}</h3>${items}</div>` : '';
  const ruleBox = (r, title, sub, extra = '', cls = '') => html`<div class="rule ${cls}"><div class="rule-top"><strong>${title}</strong>${badges(r, extra)}</div>
    ${sub ? html`<small>${sub}</small>` : ''}${sourceLine(pack, r)}</div>`;
  const hist = packHistory(card.id);
  return html`<div class="rules">
    <div class="pack-meta"><span class="pill ${fr.offersStale ? 'st-soon' : 'st-ok'}">Checked ${fmtDate(pack.checkedAt)}</span>
      <span>Rules version ${rec.version}${hist.length > 1 ? ` of ${hist.length}` : ''}</span>
      ${fr.unverifiedCount ? html`<span>${fr.unverifiedCount} unverified</span>` : ''}
      ${fr.offersStale ? html`<span>Offers may be out of date (${fr.ageDays} days old)</span>` : ''}</div>
    ${pack.card.variants?.length && card.variant && packMatchesCard(pack, card) === 'variant_mismatch' ? html`<div class="box warn">These rules are for ${pack.card.variants.join(', ')}; this card is ${card.variant}.</div>` : ''}
    ${group('Rewards', [
      ...(pack.earnRules || []).map((r) => ruleBox(r, r.label, [earnText(r, pack), scopeText(r.appliesTo),
        r.capPaise ? `cap ${formatPaise(r.capPaise)} ${PERIOD_LABEL[r.capPeriod]}` : r.capPoints ? `cap ${r.capPoints.toLocaleString('en-IN')} points ${PERIOD_LABEL[r.capPeriod]}` : ''].filter(Boolean).join(' · '))),
      ...(pack.exclusions || []).map((x) => ruleBox(x, x.label, `Excluded from ${x.excludedFrom.join(', ')} · ${scopeText(x.appliesTo)}`, html`<span class="pill st-quiet">Exclusion</span>`)),
    ])}
    ${group('Offers', offers.map((o) => ruleBox(o, o.label, [o.merchant, offerValueText(o)].filter(Boolean).join(' · '), offerPill(o), offerStatus(o, today()) === 'expired' ? 'expired' : '')))}
    ${group('Milestones', (pack.milestones || []).map((m) => ruleBox(m, m.label, `${formatPaise(m.thresholdPaise)} ${PERIOD_LABEL[m.period]} · ${m.benefit}${m.kind === 'fee_waiver' ? (m.feeReversal === 'auto' ? ' · reversed automatically' : ' · you must request it') : ''}`,

function checkPack(cardId, text) {
  const card = state.cards.find((c) => c.id === cardId);
  let pack;
  try { pack = JSON.parse(text); } catch { state.review = { cardId, ok: false, text, errors: [{ path: '', message: 'This is not valid JSON. Copy the whole pack, from the first { to the last }.' }], warnings: [] }; return render(); }
  const v = validateRulePack(pack, today());
  if (!v.ok) { state.review = { cardId, ok: false, text, errors: v.errors, warnings: v.warnings }; return render(); }
  const prev = activePack(cardId);
  state.review = { cardId, ok: true, text, pack, warnings: v.warnings, match: packMatchesCard(pack, card), diff: diffRulePacks(prev ? prev.pack : null, pack) };
  render();
}

async function approvePack(cardId) {
  const rv = state.review;
  if (!rv?.ok || state.busy) return;
  const card = state.cards.find((c) => c.id === cardId);
  const prev = activePack(cardId);
  // Capture the versions to retire BEFORE writing: live updates can add the new version to state.packs mid-save.
  const toRetire = state.packs.filter((p) => p.cardId === cardId && p.status === 'active').map((p) => p.id);
  const nextVersion = Math.max(0, ...state.packs.filter((p) => p.cardId === cardId).map((p) => p.version || 0)) + 1;
  const applyFees = document.getElementById('apply-fees')?.checked;
  state.busy = true; render();
  try {
    const now = Date.now();
    const id = uuid();
    const rec = { id, cardId, version: nextVersion, status: 'active', pack: rv.pack, approvedAt: now, createdAt: now, updatedAt: now };
    await state.db.collection('rulePacks').doc(id).set(rec);
    for (const oldId of toRetire) {
      if (oldId === id) continue;
      await state.db.collection('rulePacks').doc(oldId).update({ status: 'superseded', updatedAt: Date.now() });
    }
    const update = { ...card, lastVerifiedAt: Date.parse(rv.pack.checkedAt + 'T00:00:00') };
    if (applyFees) {
      if (rv.pack.fees.annualFeePaise !== undefined) update.annualFeePaise = rv.pack.fees.annualFeePaise;
      if (rv.pack.fees.joiningFeePaise !== undefined) update.joiningFeePaise = rv.pack.fees.joiningFeePaise;
    }
    const r = await saveCard(update);
    if (!r.ok) throw new Error(Object.values(r.errors).join('; '));
    state.importing = null; state.review = null;
    toast(`Rules saved as version ${rec.version}`);
  } catch (e) { state.loadErr = e.code ? friendly(e) : e.message; }
  state.busy = false; render();
}

function lastAtShop(raw, test) { const name = formatShopName(raw); return name ? allPurchases().find((p) => test(p) && formatShopName(p.merchant) === name) || null : null; }
const applianceForShop = (raw) => lastAtShop(raw, (p) => p.applianceId)?.applianceId || null;
const subscriptionForShop = (raw) => lastAtShop(raw, (p) => p.subscription?.every)?.subscription || null;

function renameBox(d) {
  if (!d.id) return '';
  const orig = allPurchases().find((p) => p.id === d.id);
  if (!orig) return '';
  const name = formatShopName(orig.merchant);
  const others = allPurchases().filter((p) => p.id !== d.id && formatShopName(p.merchant) === name).length;
  return html`<label class="check rename" id="rename-box" data-original="${name}" data-others="${others}" hidden>
    <input type="checkbox" name="renameAll" checked ${others ? '' : 'hidden'}><span id="rename-text"></span></label>`;
}

/** Text for the rename option, given the original shop, the new name and how many other purchases share the original. */
function renameText(orig, next, others) {
  const shops = new Map();
  for (const p of allPurchases()) { const n = formatShopName(p.merchant); shops.set(n, (shops.get(n) || 0) + 1); }
  const existing = next !== orig && shops.has(next) ? shops.get(next) : 0;
  const plural = (n) => `${n} purchase${n === 1 ? '' : 's'}`;
  if (others) {
    return existing ? `Move all ${plural(others + 1)} to shop “${next}”` : `Rename the ${others} other purchase${others === 1 ? '' : 's'} called “${orig}”`;
  }
  return existing ? `This purchase moves to shop “${next}” (${plural(existing)} there already)` : `This purchase will be saved under the new shop name “${next}”`;
}

      <div class="field"><label for="b-amount">Amount paid (₹)</label><input id="b-amount" name="amount" inputmode="decimal" value="${rup(d.amountPaise)}" autocomplete="off">${err('amountPaise')}</div>
    </div>

/** Amount still due on a card right now (what the payment form suggests). */
function dueNow(cardId) {
  const c = cardById(cardId);
  const b = c ? billingInfo(c, allPurchases(), today(), state.billPayments) : null;
  return b?.payBy?.remainingPaise || null;
}

async function savePayment() {
  if (state.busy || !state.db) return;
  const f = Object.fromEntries(new FormData(document.getElementById('pay-form')));
  const amount = String(f.amount || '').trim() === '' ? 0 : (parseRupeesToPaise(f.amount) ?? -1);
  const draft = { ...state.payDraft, cardId: f.cardId, amountPaise: amount, date: f.date, fromCardId: f.fromCardId || null, note: f.note };
  const r = validateBillPayment({ ...draft, id: draft.id || uuid() });
  if (!r.ok) { state.payDraft = draft; state.payErrors = r.errors; return render(); }
  state.busy = true; render();
  try {
    await state.db.collection('billPayments').doc(r.payment.id).set(r.payment);
    const c = cardById(r.payment.cardId);
    state.payDraft = null; state.payErrors = {};
    toast(`Payment of ${formatPaise(r.payment.amountPaise)} recorded${c ? ' for ' + cardLabel(c) : ''}`);
  } catch (e) { state.payErrors = { _form: friendly(e) }; }
  state.busy = false; render();
}

async function deletePayment(id) {
  if (!state.db) return;
  try { await state.db.collection('billPayments').doc(id).delete(); state.payConfirmDel = null; toast('Payment deleted'); }
  catch (e) { state.loadErr = friendly(e); }
  render();
}

function billLine(c, ps, t) {
  const b = billingInfo(c, ps, t, state.billPayments);
  if (!b) return '';
  const pay = b.payBy;
  const days = pay ? daysBetween(t, pay.date) : null;
  const extraPaid = b.unbilledPaise - b.unbilledDuePaise;
  const items = [{ date: b.nextBill, node: html`<span>Next Bill ${fmtShort(b.nextBill)} · <b class="num">${formatPaise(b.unbilledDuePaise)}</b> so far*${extraPaid ? ` (${formatPaise(extraPaid)} paid)` : ''}</span>` }];
  if (pay) items.push({ date: pay.date, node: html`<span class="${days <= 3 && pay.remainingPaise ? 'due-soon' : ''}">Payment Date ${fmtShort(pay.date)} · <b class="num">${formatPaise(pay.remainingPaise)}</b>${pay.billed ? ' due' : ' so far'}*${pay.paidPaise ? ` (${formatPaise(pay.paidPaise)} paid)` : ''}</span>` });
  if (b.settledBill && b.lastDue && b.lastDue >= t) items.push({ date: b.lastBill, node: html`<span class="paid-ok">${fmtShort(b.lastBill)} bill paid ✓</span>` });
  items.sort((x, y) => x.date.localeCompare(y.date));
  return html`<div class="meta bill-line">${items.map((x, i) => html`${i ? ' · ' : ''}${x.node}`)}</div>`;
}

/** Category for a shop name: the one you used most recently for it, else the merchant directory's. */
function categoryForShop(raw) {
  const name = formatShopName(raw);
  if (!name) return null;
  const mine = allPurchases().find((p) => formatShopName(p.merchant) === name);
  if (mine) return mine.category;
  const m = MERCHANTS.find((x) => x.name === name);
  return m ? m.categories[0] : null;
}

function readLogForm() {
  const f = Object.fromEntries(new FormData(document.getElementById('log-form')));
  const money = (v, blank = null) => (String(v ?? '').trim() === '' ? blank : parseRupeesToPaise(v) ?? -1);
  const amountPaise = money(f.amount, null);
  const box = document.getElementById('rename-box');
  return { ...state.logDraft, merchant: f.merchant, amountPaise: amountPaise === null ? 0 : amountPaise, cardId: f.cardId, date: f.date, category: f.category,
    status: state.logDraft.status || 'completed', refundPaise: state.logDraft.refundPaise || 0,
    notes: f.notes, renameAll: !!box && !box.hidden && f.renameAll === 'on',
    vehicleRelated: f.vehicleRelated === 'on' && !document.getElementById('veh-box')?.hidden,
    vehicleId: f.vehicleRelated === 'on' && !document.getElementById('veh-box')?.hidden ? (f.vehicleId || '') : null,
    loanRelated: f.loanRelated === 'on' && !document.getElementById('loan-box')?.hidden,
    loanId: f.loanRelated === 'on' && !document.getElementById('loan-box')?.hidden ? (f.loanId || '') : null,
    applianceRelated: f.applianceRelated === 'on' && !document.getElementById('app-box')?.hidden,
    applianceId: f.applianceRelated === 'on' && !document.getElementById('app-box')?.hidden ? (f.applianceId || '') : null,
    subscription: f.isSubscription === 'on' ? { every: f.every || 'monthly', ...(f.every === 'custom' ? { count: String(f.everyCount || '').trim(), unit: f.everyUnit } : {}), ...(f.variable === 'on' ? { variable: true } : {}) } : null };
}

async function deletePurchase() {
  const id = state.logDraft?.id;
  const existing = id ? allPurchases().find((p) => p.id === id) : null;
  if (!existing || state.busy || !state.db) return;
  state.busy = true; render();
  try {
    const k = monthKey(existing.date);
    const m = state.months.find((x) => x.id === k);
    await state.db.collection('purchaseMonths').doc(k).set({ ...m, id: k, purchases: (m.purchases || []).filter((x) => x.id !== id), updatedAt: Date.now() });
    state.logDraft = null; state.logConfirmDelete = false;
    toast(`Deleted: ${formatShopName(existing.merchant)} ${formatPaise(existing.amountPaise)}`);
  } catch (e) { state.logErrors = { _form: friendly(e) }; }
  state.busy = false; render();
}

async function savePurchase(confirmedDuplicate) {
  if (state.busy) return;
  const draft = readLogForm();
  draft.merchant = formatShopName(draft.merchant);
  const existing = draft.id ? allPurchases().find((p) => p.id === draft.id) : null;
  const r = validatePurchase({ ...draft, id: draft.id || uuid() }, existing);
  if (draft.vehicleRelated && !draft.vehicleId && activeVehicles().length) { r.ok = false; r.errors = { ...(r.errors || {}), vehicleId: 'Pick the vehicle, or untick “Is this vehicle related?”.' }; }
  if (draft.loanRelated && !draft.loanId && activeLoans().length) { r.ok = false; r.errors = { ...(r.errors || {}), loanId: 'Pick the loan, or untick “Is this a loan repayment?”.' }; }
  if (draft.applianceRelated && !draft.applianceId && activeAppliances().length) { r.ok = false; r.errors = { ...(r.errors || {}), applianceId: 'Pick the appliance or device, or untick the box.' }; }
  if (!r.ok) { state.logDraft = draft; state.logErrors = r.errors; return render(); }
  const p = r.purchase;
  const dups = findDuplicates(p, allPurchases());
  if (dups.length && !confirmedDuplicate) { state.logDraft = draft; state.logDup = dups; state.logErrors = {}; return render(); }
  if (!state.db) { state.logDraft = draft; state.logErrors = { _form: 'Saving is not available in this view.' }; return render(); }
  state.busy = true; state.logDraft = draft; render();
  try {
    const now = Date.now();
    const newKey = monthKey(p.date);
    const oldKey = existing ? monthKey(existing.date) : null;
    const monthDoc = (k) => state.months.find((m) => m.id === k);
    if (oldKey && oldKey !== newKey) {
      const old = monthDoc(oldKey);
      await state.db.collection('purchaseMonths').doc(oldKey).set({ ...old, purchases: (old.purchases || []).filter((x) => x.id !== p.id), updatedAt: now });
    }
    const cur = monthDoc(newKey);
    const list = (cur?.purchases || []).filter((x) => x.id !== p.id).concat(p);
    await state.db.collection('purchaseMonths').doc(newKey).set({ id: newKey, month: newKey, purchases: list, createdAt: cur?.createdAt || now, updatedAt: now });
    // Optional: correct the same shop name on every other purchase too.
    const oldName = existing ? formatShopName(existing.merchant) : null;
    if (draft.renameAll && oldName && oldName !== p.merchant) {
      for (const m of state.months) {
        const base = m.id === newKey ? list : (m.purchases || []);
        if (!base.some((x) => x.id !== p.id && formatShopName(x.merchant) === oldName)) continue;
        const fixed = base.map((x) => (x.id !== p.id && formatShopName(x.merchant) === oldName ? { ...x, merchant: p.merchant, updatedAt: now } : x));
        await state.db.collection('purchaseMonths').doc(m.id).set({ ...m, id: m.id, purchases: fixed, updatedAt: now });
      }
    }
    const card = cardById(p.cardId);
    state.logDraft = null; state.logErrors = {}; state.logDup = null;
    toast(existing ? 'Purchase updated' : `Saved: ${formatPaise(p.amountPaise)} on ${card ? cardLabel(card) : 'card'}`);
  } catch (e) { state.logErrors = { _form: friendly(e) }; }
  state.busy = false; render();
}

const fmtDay = (d, t) => {
  const label = new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
  if (d === t) return 'Today · ' + label;
  const y = new Date(Date.parse(t + 'T00:00:00Z') - 86400000).toISOString().slice(0, 10);
  return d === y ? 'Yesterday · ' + label : label;
};

/** Per-day spending: today, daily average, highest day; for a month, one bar per day (tap to see that day). */
function dailyView(daily, range, t) {
  const stats = html`<div class="day-stats">
    ${range.start <= t && t <= range.end ? html`<span>Today <b class="num">${formatPaise(daily.todayPaise)}</b></span>` : ''}
    <span>Daily average <b class="num">${formatPaise(daily.averagePaise)}</b></span>
    ${daily.highest ? html`<span>Highest <button class="link-btn" data-action="spend-day" data-day="${daily.highest.date}"><b class="num">${formatPaise(daily.highest.paise)}</b> on ${fmtShort(daily.highest.date)}</button></span>` : ''}
  </div>`;
  if (state.spendPeriod !== 'month') return html`<h2>By day</h2><section class="total daily">${stats}<p class="meta">Purchases below are grouped by day with each day's total. Switch to This month to see a bar for each day.</p></section>`;
  const dates = [];
  for (let d = range.start; d <= range.end; d = new Date(Date.parse(d + 'T00:00:00Z') + 86400000).toISOString().slice(0, 10)) dates.push(d);
  const max = Math.max(1, ...dates.map((d) => daily.days[d]?.paise || 0));
  const label = (d) => { const n = Number(d.slice(8)); return n % 7 === 1 || d === t ? String(n) : ''; };
  return html`<h2>By day</h2><section class="total daily">
    ${stats}
    <div class="days ${state.spendDay ? 'has-sel' : ''}" role="group" aria-label="Spend per day">
      ${dates.map((d) => { const v = daily.days[d]?.paise || 0; const future = d > t; return html`<button class="day ${v ? '' : 'zero'} ${d === t ? 'today' : ''} ${future ? 'future' : ''} ${state.spendDay === d ? 'selected' : ''}"
        ${future ? 'disabled' : ''} data-action="spend-day" data-day="${d}" aria-pressed="${state.spendDay === d}" aria-label="${fmtShort(d)}: ${formatPaise(v)}" title="${fmtShort(d)}: ${formatPaise(v)}"><span style="height:${v ? Math.max(4, Math.round((v * 100) / max)) : 0}%"></span></button>`; })}
    </div>
    <div class="day-axis" aria-hidden="true">${dates.map((d) => html`<span>${label(d)}</span>`)}</div>
  </section>`;
}

/** Shop / outlet search: case-insensitive, ignores spaces and punctuation, matches any part of the name. */
const squash = (v) => String(v || '').toLowerCase().replace(/[^a-z0-9]/g, '');
function shopMatches(p, q) { const n = squash(q); return !n || squash(p.merchant).includes(n); }

function spendsView() {
  const t = today();
  const range = periodContaining(state.spendPeriod === 'month' ? 'calendar_month' : state.spendPeriod === 'quarter' ? 'calendar_quarter' : 'calendar_year', t);
  const ps = allPurchases();
  const tot = totals(ps, range.start, range.end);
  const active = state.cards.filter((c) => c.status === 'active');
  // Highest spend first; cards with no spend in the period follow, alphabetically.
  const cardsShown = [...active, ...state.cards.filter((c) => c.status !== 'active' && tot.byCard[c.id])]
    .sort((a, b) => (tot.byCard[b.id] || 0) - (tot.byCard[a.id] || 0) || cardLabel(a).localeCompare(cardLabel(b)));
  const maxCard = Math.max(1, ...cardsShown.map((c) => tot.byCard[c.id] || 0));
  const cats = Object.entries(tot.byCategory).sort((a, b) => b[1] - a[1]);
  const maxCat = Math.max(1, ...cats.map((c) => c[1]));
  const list = ps.filter((p) => p.date >= range.start && p.date <= range.end && (!state.spendCard || p.cardId === state.spendCard) && (!state.spendCategory || p.category === state.spendCategory) && (!state.spendDay || p.date === state.spendDay) && shopMatches(p, state.spendQuery) && (!state.spendVehicle || p.vehicleId === state.spendVehicle) && (!state.spendAppliance || p.applianceId === state.spendAppliance) && (!state.spendLoan || p.loanId === state.spendLoan));
  const daily = dailySpend(ps, range.start, range.end, t);
  const dayTotals = {};
  for (const p of list) dayTotals[p.date] = (dayTotals[p.date] || 0) + netSpend(p);
  const periodName = { month: new Date(t + 'T00:00:00').toLocaleDateString('en-IN', { month: 'long', year: 'numeric' }), quarter: `${fmtShort(range.start)} – ${fmtShort(range.end)}`, year: String(t.slice(0, 4)) }[state.spendPeriod];
  const pct = (v) => (tot.totalPaise ? Math.round((v * 100) / tot.totalPaise) : 0);

  const progress = active.map((c) => {
    const rec = activePack(c.id);
    if (!rec) return null;
    const items = milestoneProgress(c, rec.pack, ps, t);
    if (!items.length) return null;
    return html`<article class="row"><div class="detail flush">
      <div class="ins">${cardLabel(c)}</div>
      ${items.map((m) => m.missing ? html`<div class="ms"><div class="ms-top"><span>${m.milestone.label}</span></div><p class="hint">Add the card's ${m.missing === 'issueDate' ? 'issue date' : 'statement day'} to track this.</p></div>`
        : html`<div class="ms">
          <div class="ms-top"><span>${m.milestone.label}</span>${m.met ? html`<span class="pill st-ok">Reached</span>` : ''}</div>
          <div class="bar" role="img" aria-label="${m.percent}% of ${formatPaise(m.milestone.thresholdPaise)}"><span style="width:${m.percent}%"></span></div>
          <div class="meta num">${formatPaise(m.eligiblePaise)} of ${formatPaise(m.milestone.thresholdPaise)}${m.met ? '' : ` · ${formatPaise(m.remainingPaise)} to go`} · ${fmtShort(m.period.start)} – ${fmtDate(m.period.end)}</div>
          ${m.milestone.kind === 'lounge_unlock' && m.previous ? html`<div class="meta">${m.previous.met ? 'Unlocked for now: last period reached ' + formatPaise(m.previous.eligiblePaise) + '.' : 'Not unlocked for now: last period logged ' + formatPaise(m.previous.eligiblePaise) + '.'}</div>` : ''}
        </div>`)}
    </div></article>`;
  }).filter(Boolean);

  return html`
    ${state.logDraft ? logForm() : ''}
    <div class="chips" role="group" aria-label="Period">${[['month', 'This month'], ['quarter', 'This quarter'], ['year', 'This year']].map(([k, l]) =>
      html`<button class="chip" data-action="spend-period" data-p="${k}" aria-pressed="${state.spendPeriod === k}">${l}</button>`)}</div>
    <section class="total">
      <div class="meta">${periodName}</div>
      <div class="total-n num">${formatPaise(tot.totalPaise)}</div>
      <div class="meta">${tot.count} purchase${tot.count === 1 ? '' : 's'}${tot.pendingPaise ? ` · ${formatPaise(tot.pendingPaise)} pending` : ''}</div>
    </section>
    ${dailyView(daily, range, t)}
    <h2>By card</h2>
    ${active.length ? html`<section class="list">${cardsShown.map((c) => { const v = tot.byCard[c.id] || 0; return html`
      <button class="row spend-row ${state.spendCard === c.id ? 'selected' : ''}" data-action="spend-card" data-id="${c.id}" aria-pressed="${state.spendCard === c.id}">
        <div class="spend-top"><span class="ins">${cardLabel(c)}</span><span class="num">${formatPaise(v)}${v ? html` <small class="meta">${pct(v)}%</small>` : ''}</span></div>
        <div class="bar"><span style="width:${Math.round((v * 100) / maxCard)}%"></span></div>
        ${billLine(c, ps, t)}
      </button>`; })}</section>
      ${cardsShown.some((c) => billingInfo(c, ps, t, state.billPayments)?.payBy) ? html`<p class="hint footnote">* Bill and payment amounts are from purchases logged here up to the bill date, less bill payments you record. Your bank statement is the final word.</p>` : ''}
      ${state.canWrite && active.some((c) => c.kind === 'credit') && !state.payDraft ? html`<div class="acc-actions"><button class="btn ghost small" data-action="pay-new">Record credit card bill payment</button></div>` : ''}
      ${state.payDraft && state.payDraft.where === 'spends' ? payForm() : ''}` : html`<div class="empty"><p>Add your cards in Cards first.</p></div>`}
    ${cats.length ? html`<h2>By category</h2><section class="panel plain cat-list">${cats.map(([k, v]) => html`
      <button class="cat-row ${state.spendCategory === k ? 'selected' : ''}" data-action="spend-cat" data-cat="${k}" aria-pressed="${state.spendCategory === k}"><span>${CAT_LABEL[k] || k}</span><div class="bar thin"><span style="width:${Math.round((v * 100) / maxCat)}%"></span></div><span class="num">${formatPaise(v)}</span></button>`)}</section>` : ''}
    ${progress.length ? html`<h2>Card milestones</h2><section class="list">${progress}</section>` : ''}
    <h2 id="purchases-h">Purchases</h2>
    ${ps.length ? html`<div class="p-search"><input id="p-search" type="search" placeholder="Search by shop or outlet" aria-label="Search purchases by shop or outlet" value="${state.spendQuery}" list="p-shops" autocomplete="off" enterkeyhint="search">
      <datalist id="p-shops">${[...new Set(ps.filter((p) => p.date >= range.start && p.date <= range.end).map((p) => formatShopName(p.merchant)))].sort().map((n) => html`<option value="${n}">`)}</datalist></div>` : ''}
    ${state.spendCard || state.spendCategory || state.spendDay || state.spendVehicle || state.spendAppliance || state.spendLoan || state.spendQuery.trim() ? html`<div class="chips filters">
      ${state.spendLoan ? html`<button class="chip" aria-pressed="true" data-action="spend-loan" data-id="${state.spendLoan}">${loanById(state.spendLoan)?.name || 'Loan'} ✕</button>` : ''}
      ${state.spendAppliance ? html`<button class="chip" aria-pressed="true" data-action="spend-appliance" data-id="${state.spendAppliance}">${applianceById(state.spendAppliance)?.name || 'Appliance'} ✕</button>` : ''}
      ${state.spendVehicle ? html`<button class="chip" aria-pressed="true" data-action="spend-vehicle" data-id="${state.spendVehicle}">${vehicleById(state.spendVehicle)?.name || 'Vehicle'} ✕</button>` : ''}
      ${state.spendDay ? html`<button class="chip" aria-pressed="true" data-action="spend-day" data-day="${state.spendDay}">${fmtShort(state.spendDay)} ✕</button>` : ''}
      ${state.spendCard ? html`<button class="chip" aria-pressed="true" data-action="spend-card" data-id="${state.spendCard}">${cardLabel(cardById(state.spendCard) || {})} ✕</button>` : ''}
      ${state.spendCategory ? html`<button class="chip" aria-pressed="true" data-action="spend-cat" data-cat="${state.spendCategory}">${CAT_LABEL[state.spendCategory] || state.spendCategory} ✕</button>` : ''}
      <span class="meta">${list.length} purchase${list.length === 1 ? '' : 's'} · ${formatPaise(list.reduce((a, p) => a + netSpend(p), 0))} · tap one to change it</span></div>` : ''}
    ${!state.ready.months ? html`<div class="empty"><p>Loading purchases…</p></div>`
      : !list.length ? html`<div class="empty"><p>${state.spendQuery.trim() ? `No purchases at “${state.spendQuery.trim()}” with these filters.` : ps.length ? 'No purchases in this period.' : 'No purchases logged yet. In Ask, tap “I paid with this card” after paying, or use Add purchase.'}</p></div>`
      : html`<section class="list">${list.slice(0, state.purchaseLimit).map((p, i, shown) => { const c = cardById(p.cardId); const st = STATUS_PILL[p.status]; return html`
        ${i === 0 || shown[i - 1].date !== p.date ? html`<div class="day-h"><span>${fmtDay(p.date, t)}</span><span class="num">${formatPaise(dayTotals[p.date] || 0)}</span></div>` : ''}
        <button class="row purchase" data-action="log-edit" data-id="${p.id}">
          <div><div class="ins">${formatShopName(p.merchant)}</div><div class="meta">${CAT_LABEL[p.category] || p.category} · ${c ? cardLabel(c) : 'Unknown card'}${p.vehicleId && vehicleById(p.vehicleId) ? ' · ' + vehicleById(p.vehicleId).name : ''}${p.applianceId && applianceById(p.applianceId) ? ' · ' + applianceById(p.applianceId).name : ''}${p.loanId && loanById(p.loanId) ? ' · ' + loanById(p.loanId).name : ''}${p.subscription?.every ? ' · ↻ ' + subscriptionLabel(p.subscription) : ''}</div></div>
          <div class="right"><span class="num ${p.status === 'cancelled' ? 'strike' : ''}">${formatPaise(p.amountPaise)}</span>
            ${st ? html`<span class="pill ${st[0]}">${p.status === 'refunded' ? `Refunded ${formatPaise(p.refundPaise)}` : st[1]}</span>` : ''}</div>
        </button>`; })}</section>
        ${list.length > state.purchaseLimit ? html`<div class="actions center-actions"><button class="btn ghost" data-action="more-purchases">Show ${Math.min(10, list.length - state.purchaseLimit)} more <span class="meta">(${list.length - state.purchaseLimit} left)</span></button></div>` : ''}`}
`;
}

/* ---------------- Others: vehicles and insurances ---------------- */

function othersView() {
  const t = today();
  const type = state.spendPeriod === 'month' ? 'calendar_month' : state.spendPeriod === 'quarter' ? 'calendar_quarter' : 'calendar_year';
  const range = periodContaining(type, t);
  const periodName = { month: 'this month', quarter: 'this quarter', year: 'this year' }[state.spendPeriod];
  const ps = allPurchases();
  const vt = vehicleTotals(ps, range.start, range.end);
  const vs = activeVehicles();
  const vSpend = vs.reduce((a, v) => a + (vt[v.id]?.paise || 0), 0);
  const items = activeAppliances();
  const amcSoon = items.filter((v) => v.amc?.endDate && daysBetween(t, v.amc.endDate) <= 60).length;
  const pols = state.policies;
  const polSoon = pols.filter((x) => x.renewalDate && daysBetween(t, x.renewalDate) <= 60).length;
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const sm = subscriptionMonthSummary(ps, t);
  const monthName = new Date(t + 'T00:00:00').toLocaleDateString('en-IN', { month: 'short' });
  const subTotals = html`<span class="sub-totals">
      <span><small>Paid in ${monthName}</small><b class="num">${formatPaise(sm.paidPaise)}</b></span>
      <span class="${sm.includesNonMonthly ? 'due-odd' : ''}" ${sm.includesNonMonthly ? html`title="Includes a payment that is not monthly or 28-day, so this due amount is only for ${monthName}"` : ''}><small>Due in ${monthName}</small><b class="num">~${formatPaise(sm.duePaise)}</b></span>
    </span>`;
  const loans = activeLoans();
  const owed = loans.reduce((a, l) => a + loanStatus(l, ps, t).outstandingPaise, 0);
  const sections = {
    subs: () => accordion('subs', 'Subscriptions', subTotals, false, () => subscriptionsView(ps)),
    loans: () => accordion('loans', 'Debts', loans.length ? html`<span class="sub-totals"><span><small>${loans.length} loan${loans.length === 1 ? '' : 's'} · outstanding</small><b class="num">${formatPaise(roundRupee(owed))}</b></span></span>` : 'None added', false, () => loansView(ps), !!state.loanDraft),
    vehicles: () => accordion('vehicles', 'Vehicles', vs.length ? `${plural(vs.length, 'vehicle', 'vehicles')} · ${formatPaise(vSpend)} ${periodName}` : 'None added', false, () => vehiclesView(ps, range, periodName), !!state.vehicleDraft),
    appliances: () => accordion('appliances', 'Appliances & devices', items.length ? `${plural(items.length, 'item', 'items')}${amcSoon ? ` · ${plural(amcSoon, 'AMC', 'AMCs')} due soon` : ''}` : 'None added', amcSoon > 0, () => appliancesView(ps, range, periodName), !!state.applianceDraft),
    family: () => accordion('family', 'Family members', state.family.length ? state.family.map((m) => m.name).sort((a, b) => a.localeCompare(b)).join(', ') : 'None added', false, () => familyView(), !!state.memberDraft),
    policies: () => accordion('policies', 'Insurances', pols.length ? `${plural(pols.length, 'policy', 'policies')}${polSoon ? ` · ${polSoon} renew${polSoon === 1 ? 's' : ''} soon` : ''}` : 'None added', polSoon > 0, () => policiesView(), !!state.policyDraft),
  };
  const order = othersOrder();
  return html`<div class="reorder-bar">${state.reordering ? html`<span class="meta">Use the arrows to move sections.</span><button class="btn small" data-action="reorder-done">Done</button>` : html`<button class="btn ghost small" data-action="reorder">Reorder sections</button>`}</div>
    ${order.map((k, i) => sections[k](i, order.length))}`;
}

const roundRupee = (p) => Math.round(p / 100) * 100;

/** Debts: outstanding per loan after the repayments logged; tap a loan to see its repayments. */
function loansView(ps) {
  const t = today();
  const loans = activeLoans();
  const closed = state.loans.filter((l) => l.status === 'closed').length;
  const pct = (bps) => `${(bps / 100).toLocaleString('en-IN', { maximumFractionDigits: 2 })}%`;
  const monthYear = (ym) => new Date(ym + '-01T00:00:00').toLocaleDateString('en-IN', { month: 'short', year: 'numeric' });
  return html`${state.canWrite && !state.loanDraft ? html`<div class="acc-actions"><button class="btn ghost small" data-action="loan-new">Add loan</button></div>` : ''}
    ${state.loanDraft ? loanForm() : ''}
    ${!state.ready.loans ? html`<div class="empty"><p>Loading…</p></div>`
      : !loans.length ? (state.loanDraft ? '' : html`<div class="empty"><p>Add home loans, personal loans and hand loans. When you log an EMI or repayment, tick “Is this a loan repayment?” and the outstanding updates.</p></div>`)
      : html`<section class="list">${loans.map((l) => {
        const st = loanStatus(l, ps, t);
        const hand = l.type === 'hand';
        const terms = hand ? ['Flexible', l.annualRateBps ? pct(l.annualRateBps) + ' (not charged here)' : '', l.emiPaise ? `usually ${formatPaise(l.emiPaise)}` : ''].filter(Boolean).join(' · ')
          : `EMI ${formatPaise(l.emiPaise)} · ${pct(l.annualRateBps)} · ${l.termMonths} months`;
        return html`<article class="row veh-row ${state.spendLoan === l.id ? 'selected' : ''}">
          <button class="veh-main" data-action="spend-loan" data-id="${l.id}">
            <div class="spend-top"><span class="ins">${l.name}</span><span class="num loan-out">${formatPaise(roundRupee(st.outstandingPaise))}<small class="meta">outstanding</small></span></div>
            <div class="meta">${LOAN_TYPE_LABEL[l.type]}${l.lender ? ' · ' + l.lender : ''}</div>
            <div class="bar thin" role="img" aria-label="${st.paidPercent}% repaid"><span style="width:${st.paidPercent}%"></span></div>
            <div class="meta">${terms}</div>
            <div class="meta">${st.outstandingPaise === 0 ? 'Fully repaid ✓' : `${st.paidPercent}% repaid`}${st.payments ? ` · ${st.payments} payment${st.payments === 1 ? '' : 's'}, last ${fmtShort(st.lastPaid)}` : ' · no repayments logged yet'}${st.interestPaise ? ` · interest so far ${formatPaise(st.interestPaise)}` : ''}${!hand && st.emisLeft ? ` · about ${st.emisLeft} EMIs left (ends ~${monthYear(st.endsAround)})` : ''}</div>
          </button>
          ${state.canWrite ? html`<button class="btn ghost small" data-action="loan-edit" data-id="${l.id}" aria-label="Edit ${l.name}">Edit</button>` : ''}
          ${st.missingEarlier ? html`<p class="hint warn-note">Earlier EMIs aren't logged, so interest for that time is counted and the outstanding looks too high. Tap Edit → “Already paying this loan?” and enter the outstanding from your loan statement.</p>` : ''}
        </article>`; })}</section>
        <p class="hint">Outstanding is worked out from the repayments you log: interest is added for the days between payments at the loan's rate, then each payment is taken off. Hand loans are amount borrowed minus repayments. Your lender's statement is the final word.</p>`}
    ${closed ? html`<p class="hint">${closed} closed loan${closed === 1 ? '' : 's'} hidden; their repayments are kept.</p>` : ''}`;
}

      ${d.id ? html`<button class="btn ghost small danger-text push-right" type="button" data-action="loan-close">Mark as closed</button>` : ''}</div>

async function saveLoan(patch = {}) {
  if (state.busy || !state.db) return;
  const f = Object.fromEntries(new FormData(document.getElementById('loan-form')));
  const money = (v) => (String(v ?? '').trim() === '' ? null : parseRupeesToPaise(v) ?? -1);
  const num = (v, scale = 1) => { const t = String(v ?? '').trim(); if (t === '') return null; const n = Number(t); return Number.isFinite(n) ? Math.round(n * scale) : -1; };
  const opening = document.querySelector('#loan-form details.opening')?.open ? money(f.opening) : null;
  const draft = { ...state.loanDraft, type: f.type, name: f.name, lender: f.lender, principalPaise: money(f.principal), startDate: f.startDate,
    annualRateBps: num(f.rate, 100), termMonths: num(f.term), emiPaise: money(f.emi), openingPaise: opening, openingDate: opening != null ? f.openingDate : '', notes: f.notes, ...patch };
  const existing = draft.id ? loanById(draft.id) : null;
  const r = validateLoan({ ...draft, id: draft.id || uuid() }, existing);
  if (!r.ok) { state.loanDraft = draft; state.loanErrors = r.errors; return render(); }
  state.busy = true; render();
  try {
    await state.db.collection('loans').doc(r.loan.id).set(r.loan);
    state.loanDraft = null; state.loanErrors = {};
    if (r.loan.status === 'closed' && state.spendLoan === r.loan.id) state.spendLoan = null;
    toast(r.loan.status === 'closed' ? `${r.loan.name} closed` : existing ? 'Loan updated' : `${r.loan.name} added`);
  } catch (e) { state.loanErrors = { _form: friendly(e) }; }
  state.busy = false; render();
}
