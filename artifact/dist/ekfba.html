async function saveMember() {
  if (state.busy || !state.db) return;
  const f = Object.fromEntries(new FormData(document.getElementById('mem-form')));
  const draft = { ...state.memberDraft, name: f.name, relation: f.relation };
  const existing = draft.id ? state.family.find((m) => m.id === draft.id) : null;
  const r = validateMember({ ...draft, id: draft.id || uuid() }, state.family, existing);
  if (!r.ok) { state.memberDraft = draft; state.memberErrors = r.errors; return render(); }
  state.busy = true; render();
  try {
    await state.db.collection('family').doc(r.member.id).set(r.member);
    // A rename carries over to the policies that list the old name.
    if (existing && existing.name !== r.member.name) {
      for (const p of renameInPolicies(state.policies, existing.name, r.member.name)) await state.db.collection('policies').doc(p.id).set({ ...p, updatedAt: Date.now() });
    }
    state.memberDraft = null; state.memberErrors = {};
    toast(existing ? 'Saved' : `${r.member.name} added`);
  } catch (e) { state.memberErrors = { _form: friendly(e) }; }
  state.busy = false; render();
}

async function addMemberFromPolicy() {
  const inp = document.getElementById('p-new-member');
  const name = inp?.value.trim().replace(/\s+/g, ' ');
  if (!name || !state.db) return;
  state.policyDraft = readPolicyForm();
  const existing = state.family.find((m) => m.name.toLowerCase() === name.toLowerCase());
  if (!existing) {
    const r = validateMember({ name, id: uuid() }, state.family);
    if (!r.ok) { state.policyErrors = { ...state.policyErrors, people: Object.values(r.errors)[0] }; return render(); }
    try { await state.db.collection('family').doc(r.member.id).set(r.member); state.family = [...state.family.filter((m) => m.id !== r.member.id), r.member]; }
    catch (e) { state.policyErrors = { ...state.policyErrors, people: friendly(e) }; return render(); }
  }
  const nm = existing ? existing.name : name;
  if (!state.policyDraft.people.some((x) => x.toLowerCase() === nm.toLowerCase())) state.policyDraft.people.push(nm);
  render();
  document.getElementById('p-new-member')?.focus();
}

async function deleteMember(id) {
  if (!state.db) return;
  try { await state.db.collection('family').doc(id).delete(); state.memberConfirmDel = null; toast('Removed'); }
  catch (e) { state.loadErr = friendly(e); }
  render();
}

/** A collapsible Others section: header with a one-line summary; body only when open. */
const OTHERS_SECTIONS = ['subs', 'loans', 'vehicles', 'appliances', 'family', 'policies'];
const OTHERS_TITLE = { subs: 'Subscriptions', loans: 'Debts', vehicles: 'Vehicles', appliances: 'Appliances & devices', family: 'Family members', policies: 'Insurances' };
/** The saved section order, with any section it doesn't know about added at the end. */
function othersOrder() {
  const saved = (state.othersOrder || []).filter((k) => OTHERS_SECTIONS.includes(k));
  return [...new Set([...saved, ...OTHERS_SECTIONS])];
}
async function moveSection(key, dir) {
  const order = othersOrder();
  const i = order.indexOf(key), j = i + dir;
  if (i < 0 || j < 0 || j >= order.length) return;
  [order[i], order[j]] = [order[j], order[i]];
  state.othersOrder = order; render();
  document.querySelector(`[data-action=move-sec][data-k="${key}"][data-dir="${dir}"]`)?.focus();
  try { if (state.db) await state.db.collection('settings').doc('others').set({ order, updatedAt: Date.now() }); }
  catch (e) { toast('Could not save the new order.'); }
}

/** A collapsible Others section: header with a one-line summary; body only when open. In reorder mode, up/down arrows instead. */
function accordion(key, title, summary, attention, body, forceOpen) {
  const order = othersOrder();
  const i = order.indexOf(key);
  if (state.reordering) {
    return html`<section class="acc reordering">
      <div class="acc-head" id="${key}-h">
        <span class="acc-title">${title}</span>
        <span class="move-btns">
          <button class="btn ghost small" data-action="move-sec" data-k="${key}" data-dir="-1" ${i === 0 ? 'disabled' : ''} aria-label="Move ${title} up">↑</button>
          <button class="btn ghost small" data-action="move-sec" data-k="${key}" data-dir="1" ${i === order.length - 1 ? 'disabled' : ''} aria-label="Move ${title} down">↓</button>
        </span>
      </div></section>`;
  }
  const open = forceOpen || !!state.othersOpen[key];
  return html`<section class="acc ${open ? 'open' : ''}">
    <button class="acc-head" id="${key}-h" data-action="acc" data-k="${key}" aria-expanded="${open}">
      <span class="acc-title">${title}</span>
      <span class="acc-sum ${attention ? 'attn' : ''}">${summary}</span>
      <svg class="chev" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    ${open ? html`<div class="acc-body">${body()}</div>` : ''}
  </section>`;
}

async function saveAppliance(patch = {}) {
  if (state.busy || !state.db) return;
  const f = Object.fromEntries(new FormData(document.getElementById('app-form')));
  const amount = String(f.amcAmount || '').trim() === '' ? null : (parseRupeesToPaise(f.amcAmount) ?? -1);
  const amcOn = f.amcOn === 'on';
  const draft = { ...state.applianceDraft, name: f.name, type: f.type, brand: f.brand, purchaseDate: f.purchaseDate, warrantyUntil: f.warrantyUntil, notes: f.notes, amcOn,
    amc: amcOn ? { provider: f.amcProvider, startDate: f.amcStart, endDate: f.amcEnd, amountPaise: amount, notes: f.amcNotes } : null, ...patch };
  const existing = draft.id ? applianceById(draft.id) : null;

  if (amcOn && !r.item?.amc && r.ok) { r.ok = false; r.errors = { 'amc.endDate': 'Add the date the AMC ends (its renewal date).' }; }

}

function readPolicyForm() {
  const f = Object.fromEntries(new FormData(document.getElementById('pol-form')));
  const docs = (state.policyDraft.documents || []).map((_, i) => ({ kind: f['dkind' + i], label: f['dlabel' + i], url: f['durl' + i] }));
  const type = f.type === '__new__' ? String(f.newType || '').trim() || '__new__' : f.type;
  const people = new FormData(document.getElementById('pol-form')).getAll('person');
  return { ...state.policyDraft, insurer: f.insurer, type, people, renewalDate: f.renewalDate, coverage: f.coverage, comments: f.comments,
    vehicleId: type === 'Motor' ? (f.vehicleId || null) : null, documents: docs };
}

async function savePolicy() {
  if (state.busy || !state.db) return;
  const draft = readPolicyForm();
  // Ignore blank document rows the person added but never filled.
  draft.documents = draft.documents.filter((x) => String(x.url || '').trim() || String(x.label || '').trim());
  const existing = draft.id ? state.policies.find((x) => x.id === draft.id) : null;
  const r = validatePolicy({ ...draft, type: draft.type === '__new__' ? '' : draft.type, id: draft.id || uuid() }, existing);
  if (!r.ok) { state.policyDraft = draft; state.policyErrors = r.errors; return render(); }
  state.busy = true; render();
  try {
    await state.db.collection('policies').doc(r.policy.id).set(r.policy);
    state.policyDraft = null; state.policyErrors = {}; state.policyOpen = r.policy.id;
    toast(existing ? 'Policy updated' : 'Policy added');
  } catch (e) { state.policyErrors = { _form: friendly(e) }; }
  state.busy = false; render();
}

async function deletePolicy(id) {
  if (!state.db) return;
  try { await state.db.collection('policies').doc(id).delete(); state.policyOpen = null; state.policyConfirmDel = null; toast('Policy deleted'); }
  catch (e) { state.loadErr = friendly(e); }
  render();
}

/** Vehicles: spend per vehicle in the period; tap to see its purchases; add or edit vehicles. */
function vehiclesView(ps, range, periodName) {
  const vt = vehicleTotals(ps, range.start, range.end);

  const archived = state.vehicles.filter((v) => v.status === 'archived');
  const max = Math.max(1, ...vs.map((v) => vt[v.id]?.paise || 0));
  return html`${state.canWrite && !state.vehicleDraft ? html`<div class="acc-actions"><button class="btn ghost small" data-action="veh-new">Add vehicle</button></div>` : ''}
    ${state.vehicleDraft ? vehicleForm() : ''}

      : !vs.length ? (state.vehicleDraft ? '' : html`<div class="empty"><p>Add your car, bike or scooter. Then, when you log fuel, a car wash, service, insurance and similar spends, tick “Is this vehicle related?” to track what each vehicle costs.</p></div>`)
      : html`<section class="list">${vs.map((v) => { const t = vt[v.id]; return html`
        <article class="row veh-row ${state.spendVehicle === v.id ? 'selected' : ''}">
          <button class="veh-main" data-action="spend-vehicle" data-id="${v.id}" aria-pressed="${state.spendVehicle === v.id}">
            <div class="spend-top"><span class="ins">${v.name} <small class="meta">${VEHICLE_TYPE_LABEL[v.type]}</small></span><span class="num">${formatPaise(t?.paise || 0)}</span></div>
            <div class="bar thin"><span style="width:${Math.round(((t?.paise || 0) * 100) / max)}%"></span></div>
            <div class="meta">${t ? `${t.count} purchase${t.count === 1 ? '' : 's'} · Fuel ${formatPaise(t.fuelPaise)} · Other ${formatPaise(t.paise - t.fuelPaise)}` : 'No spends'} ${periodName} · tap to see purchases</div>

}

async function saveVehicle(patch = {}) {
  if (state.busy || !state.db) return;
  const f = Object.fromEntries(new FormData(document.getElementById('veh-form')));
  const draft = { ...state.vehicleDraft, name: f.name, type: f.type, notes: f.notes, ...patch };
  const existing = draft.id ? vehicleById(draft.id) : null;
  const r = validateVehicle({ ...draft, id: draft.id || uuid() }, existing);
  if (!r.ok) { state.vehicleDraft = draft; state.vehicleErrors = r.errors; return render(); }
  state.busy = true; render();
  try {
    await state.db.collection('vehicles').doc(r.vehicle.id).set(r.vehicle);
    state.vehicleDraft = null; state.vehicleErrors = {};
    if (r.vehicle.status === 'archived' && state.spendVehicle === r.vehicle.id) state.spendVehicle = null;
    toast(r.vehicle.status === 'archived' ? `${r.vehicle.name} archived` : existing ? 'Vehicle updated' : `${r.vehicle.name} added`);
  } catch (e) { state.vehicleErrors = { _form: friendly(e) }; }
  state.busy = false; render();
}

function freshView() {
  const active = state.cards.filter((c) => c.status === 'active' && c.kind !== 'other');
  if (!active.length) return html`<div class="empty"><p>Add cards to see how fresh their rules are.</p></div>`;
  return html`<p class="hint">Offers are marked out of date 30 days after the bank pages were last checked, other rules after 180 days. To refresh, share the card's pages in the Card Manager project chat and ask for an updated rule pack.</p>
    <section class="list">${active.map((c) => {
      const rec = activePack(c.id);
      if (!rec) return html`<article class="row"><div class="row-head"><div><div class="ins">${cardLabel(c)}</div><div class="meta">${c.sourceUrls.length} official link${c.sourceUrls.length === 1 ? '' : 's'} saved</div></div><div class="right"><span class="pill st-soon">No rules</span></div></div></article>`;
      const fr = packFreshness(rec.pack, today());
      const pill = fr.baselineStale ? ['st-urgent', 'Out of date'] : fr.offersStale ? ['st-soon', 'Offers out of date'] : ['st-ok', 'Fresh'];
      return html`<article class="row"><div class="row-head"><div><div class="ins">${cardLabel(c)}</div>

        <div class="right"><span class="pill ${pill[0]}">${pill[1]}</span></div></div></article>`;

/* ---------------- Events ---------------- */

function afterRender() {
  document.getElementById('pack-file')?.addEventListener('change', async (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    if (file.size > 300000) { toast('That file is too large for a rule pack.'); return; }
    checkPack(state.importing, await file.text());
  });
  const shop = document.getElementById('l-merchant');
  const pickCategory = () => {
    const cat = categoryForShop(shop.value);
    const sel = document.getElementById('l-category');
    if (cat && sel && sel.value !== cat) { sel.value = cat; sel.classList.add('auto-filled'); setTimeout(() => sel.classList.remove('auto-filled'), 1200); }
  };
  shop?.addEventListener('change', pickCategory);
  document.getElementById('p-new-member')?.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); addMemberFromPolicy(); } });
  const bCard = document.getElementById('b-card');
  bCard?.addEventListener('change', () => { const amt = document.getElementById('b-amount'); const due = dueNow(bCard.value); if (amt && !amt.dataset.touched) amt.value = due ? String(due / 100) : ''; });
  document.getElementById('b-amount')?.addEventListener('input', (ev) => { ev.target.dataset.touched = '1'; });
  const amcBox = document.getElementById('a-amc');
  amcBox?.addEventListener('change', () => { document.getElementById('amc-fields').hidden = !amcBox.checked; });
  const ptype = document.getElementById('p-type');
  ptype?.addEventListener('change', () => {
    document.getElementById('p-newtype-f').hidden = ptype.value !== '__new__';
    document.getElementById('p-vehicle-f').hidden = ptype.value !== 'Motor';
    if (ptype.value === '__new__') document.getElementById('p-newtype')?.focus();
  });
  const lbox = document.getElementById('loan-box');
  if (lbox) {
    const lrel = document.getElementById('l-lrel'), lpick = document.getElementById('loan-pick'), lsel = document.getElementById('l-loan');
    const notesL = document.getElementById('l-notes'), catL = document.getElementById('l-category');
    const refreshL = () => {
      if (!lbox.isConnected) return;
      const remembered = !state.logDraft?.id ? loanForShop(shop.value) : null;
      if (remembered && !lrel.dataset.touched) { lrel.checked = true; if (lsel) lsel.value = remembered; }
      lbox.hidden = !(looksLoanRelated({ merchant: shop.value, notes: notesL.value, category: catL.value }) || lrel.checked);
      lpick.hidden = !lrel.checked;
    };
    lrel.addEventListener('change', () => { lrel.dataset.touched = '1'; refreshL(); });
    [shop, notesL].forEach((x) => x?.addEventListener('input', () => setTimeout(refreshL)));
    shop?.addEventListener('change', () => setTimeout(refreshL)); catL?.addEventListener('change', refreshL);
  }
  const lf = document.getElementById('loan-form');
  if (lf) {
    const emiHint = () => {
      const g = (n) => lf.elements[n]?.value || '';
      const P = parseRupeesToPaise(g('principal')), rate = parseFloat(g('rate')), n = parseInt(g('term'), 10);
      const e = P && n > 0 && rate >= 0 ? emiFor(P, Math.round(rate * 100), n) : null;
      const el = document.getElementById('emi-calc');
      if (el) el.textContent = e ? `Works out to ${formatPaise(e)} a month. Leave EMI blank to use this.` : '';
    };
    ['principal', 'rate', 'term'].forEach((n) => lf.elements[n]?.addEventListener('input', emiHint));
    lf.querySelectorAll('input[name=type]').forEach((r) => r.addEventListener('change', () => { lf.querySelectorAll('.opt').forEach((o) => { o.textContent = r.value === 'hand' ? ' (optional)' : ''; }); }));
    emiHint();
  }
  const abox = document.getElementById('app-box');
  if (abox) {
    const arel = document.getElementById('l-arel'), apick = document.getElementById('app-pick'), asel = document.getElementById('l-appliance');
    const notesA = document.getElementById('l-notes'), catA = document.getElementById('l-category');
    const subOn = document.getElementById('l-sub'), subPick = document.getElementById('sub-pick'), subEvery = document.getElementById('l-every');
    const refreshA = () => {
      if (!abox.isConnected) return; // the form was closed or re-drawn before this ran
      const auto = looksApplianceRelated({ merchant: shop.value, notes: notesA.value, category: catA.value });
      const isNew = !state.logDraft?.id;
      const remembered = isNew ? applianceForShop(shop.value) : null;
      if (remembered && !arel.dataset.touched) { arel.checked = true; if (asel) asel.value = remembered; }
      const sub = isNew ? subscriptionForShop(shop.value) : null;
      if (sub && !subOn.dataset.touched) {
        subOn.checked = true; subEvery.value = sub.every;
        if (sub.every === 'custom') { document.getElementById('l-every-n').value = sub.count; document.getElementById('l-every-unit').value = sub.unit; }
        document.getElementById('l-variable').checked = !!sub.variable;
      }
      document.getElementById('sub-custom').hidden = subEvery.value !== 'custom';
      abox.hidden = !(auto || arel.checked);
      apick.hidden = !arel.checked;
      subPick.hidden = !subOn.checked;
    };
    arel.addEventListener('change', () => { arel.dataset.touched = '1'; refreshA(); });
    subOn.addEventListener('change', () => { subOn.dataset.touched = '1'; refreshA(); });
    subEvery.addEventListener('change', () => { subOn.dataset.touched = '1'; refreshA(); if (subEvery.value === 'custom') document.getElementById('l-every-n').focus(); });
    [shop, notesA].forEach((x) => x?.addEventListener('input', () => setTimeout(refreshA)));
    shop?.addEventListener('change', () => setTimeout(refreshA)); catA?.addEventListener('change', refreshA);
  }
  const vbox = document.getElementById('veh-box');
  if (vbox) {
    const vrel = document.getElementById('l-vrel'), pick = document.getElementById('veh-pick'), vsel = document.getElementById('l-vehicle');
    const notes = document.getElementById('l-notes'), catSel = document.getElementById('l-category');
    const refresh = () => {
      if (!vbox.isConnected) return;
      const auto = looksVehicleRelated({ merchant: shop.value, notes: notes.value, category: catSel.value });
      const remembered = !state.logDraft?.id ? vehicleForShop(shop.value) : null;
      if (remembered && !vrel.dataset.touched) { vrel.checked = true; if (vsel) vsel.value = remembered; }
      vbox.hidden = !(auto || vrel.checked);
      pick.hidden = !vrel.checked;
    };
    vrel.addEventListener('change', () => { vrel.dataset.touched = '1'; refresh(); });
    // After the category is auto-picked from the shop name (that listener runs later), so a fuel shop counts.
    [shop, notes].forEach((x) => x?.addEventListener('input', () => setTimeout(refresh)));
    shop?.addEventListener('change', () => setTimeout(refresh)); catSel?.addEventListener('change', refresh);
  }
  shop?.addEventListener('input', () => { if (categoryForShop(shop.value)) pickCategory(); });
  const renameBoxEl = document.getElementById('rename-box');
  shop?.addEventListener('input', () => {
    if (!renameBoxEl) return;
    const orig = renameBoxEl.dataset.original;
    const next = formatShopName(shop.value);
    renameBoxEl.hidden = !next || next === orig;
    if (!renameBoxEl.hidden) document.getElementById('rename-text').textContent = renameText(orig, next, Number(renameBoxEl.dataset.others));
  });
  document.querySelectorAll('input[name=kind]').forEach((r) => r.addEventListener('change', () => {
    const k = document.querySelector('input[name=kind]:checked')?.value;
    const cf = document.getElementById('credit-fields');
    if (cf) cf.hidden = k !== 'credit';
    document.querySelectorAll('#card-form .card-only').forEach((el) => { el.hidden = k === 'other'; });
    const lbl = document.getElementById('f-name-label');
    if (lbl) lbl.textContent = k === 'other' ? 'Name *' : 'Card name *';
    const nm = document.getElementById('f-name');
    if (nm) nm.placeholder = k === 'other' ? 'UPI, Bank transfer, Cash' : 'Millennia';
  }));
}

$app.addEventListener('click', async (ev) => {
  const t = ev.target.closest('[data-action]');
  if (!t || t.disabled) return;
  const a = t.dataset.action, id = t.dataset.id;
  if (a === 'tab') { state.tab = t.dataset.tab; render(); }
  else if (a === 'ask-try') runAsk(t.dataset.q);
  else if (a === 'ask-cat') runAsk(state.askText, t.dataset.cat);
  else if (a === 'new') { state.editing = 'new'; state.formDraft = {}; state.formErrors = {}; render(); document.getElementById('f-bank')?.focus(); }
  else if (a === 'edit') { state.editing = id; state.formDraft = { ...state.cards.find((c) => c.id === id) }; state.formErrors = {}; render(); document.getElementById('card-form')?.scrollIntoView({ block: 'start' }); }
  else if (a === 'cancel') { state.editing = null; state.formDraft = null; state.formErrors = {}; render(); }
  else if (a === 'toggle') { state.open = state.open === id ? null : id; state.confirm = null; if (state.importing !== state.open) { state.importing = null; state.review = null; } render(); }
  else if (a === 'toggle-archived') { state.showArchived = !state.showArchived; render(); }
  else if (a === 'ask') { state.confirm = { id, what: t.dataset.what }; render(); }
  else if (a === 'cancel-confirm') { state.confirm = null; render(); }
  else if (a === 'status' || a === 'replace') {
    const card = state.cards.find((c) => c.id === id);
    const status = a === 'replace' ? 'replaced' : t.dataset.status;
    const replacedById = a === 'replace' ? document.getElementById('replace-with').value : null;
    try {
      const r = await saveCard({ ...card, status, replacedById });
      if (r.ok) { state.confirm = null; toast(`Card ${STATUS_LABEL[status].toLowerCase()}`); }
    } catch (e) { state.loadErr = friendly(e); }
    render();
  }
  else if (a === 'import') { state.importing = id; state.review = null; render(); document.getElementById('pack-text')?.focus(); }
  else if (a === 'cancel-import') { state.importing = null; state.review = null; render(); }
  else if (a === 'check-pack') checkPack(id, document.getElementById('pack-text').value);
  else if (a === 'back-to-paste') { state.review = { cardId: state.review.cardId, ok: false, text: state.review.text, errors: [], warnings: [] }; render(); }
  else if (a === 'approve') approvePack(id);
  else if (a === 'log-new') openLog({ date: today(), cardId: state.spendCard || '', category: 'other', status: 'completed', source: 'manual' });
  else if (a === 'log-from-ask') logFromAsk(id);
  else if (a === 'log-edit') { const p = flattenMonths(state.months).find((x) => x.id === id); if (p) openLog({ ...p, merchant: formatShopName(p.merchant) }); }
  else if (a === 'log-cancel') { state.logDraft = null; state.logErrors = {}; state.logDup = null; state.logConfirmDelete = false; render(); }
  else if (a === 'log-delete-ask') { state.logDraft = readLogForm(); state.logConfirmDelete = true; render(); }
  else if (a === 'log-delete-no') { state.logConfirmDelete = false; render(); }
  else if (a === 'log-delete') deletePurchase();
  else if (a === 'log-save-anyway') savePurchase(true);
  else if (a === 'mem-new') { state.memberDraft = {}; state.memberErrors = {}; render(); document.getElementById('m-name')?.focus(); }
  else if (a === 'mem-edit') { state.memberDraft = { ...state.family.find((m) => m.id === id) }; state.memberErrors = {}; render(); document.getElementById('m-name')?.focus(); }
  else if (a === 'mem-cancel') { state.memberDraft = null; state.memberErrors = {}; render(); }

  else if (a === 'mem-del-no') { state.memberConfirmDel = null; render(); }

  else if (a === 'spend-loan') {
    const fromOthers = state.tab === 'others';
    state.spendLoan = fromOthers ? id : (state.spendLoan === id ? null : id); state.purchaseLimit = 10;

    state.payDraft = { cardId, date: today(), amountPaise: cardId ? dueNow(cardId) : null, where: state.tab === 'wallet' ? 'card' : 'spends' };
    state.payErrors = {}; render(); document.getElementById('pay-form')?.scrollIntoView({ block: 'center' }); document.getElementById('b-amount')?.focus();
  }
  else if (a === 'pay-cancel') { state.payDraft = null; state.payErrors = {}; render(); }
  else if (a === 'pay-del') { state.payConfirmDel = id; render(); }
  else if (a === 'pay-del-no') { state.payConfirmDel = null; render(); }
  else if (a === 'pay-del-yes') deletePayment(id);
  else if (a === 'reorder') { state.reordering = true; render(); }
  else if (a === 'reorder-done') { state.reordering = false; render(); }
  else if (a === 'move-sec') moveSection(t.dataset.k, Number(t.dataset.dir));
  else if (a === 'acc') { const k = t.dataset.k; state.othersOpen = { ...state.othersOpen, [k]: !state.othersOpen[k] }; render(); }
  else if (a === 'app-new') { state.applianceDraft = { type: 'Mobile' }; state.applianceErrors = {}; render(); document.getElementById('app-form')?.scrollIntoView({ block: 'start' }); document.getElementById('a-name')?.focus(); }
  else if (a === 'app-edit') { state.applianceDraft = { ...applianceById(id) }; state.applianceErrors = {}; render(); document.getElementById('app-form')?.scrollIntoView({ block: 'start' }); }
  else if (a === 'app-cancel') { state.applianceDraft = null; state.applianceErrors = {}; render(); }
  else if (a === 'app-archive') saveAppliance({ status: 'archived' });
  else if (a === 'spend-appliance') {
    const fromOthers = state.tab === 'others';
    state.spendAppliance = fromOthers ? id : (state.spendAppliance === id ? null : id); state.purchaseLimit = 10;
    if (fromOthers) state.tab = 'spends';
    render();
    if (state.spendAppliance) document.getElementById('purchases-h')?.scrollIntoView({ block: 'start' });
  }
  else if (a === 'sub-open') { state.tab = 'spends'; state.spendQuery = t.dataset.shop; state.spendPeriod = 'year'; state.purchaseLimit = 10; render(); document.getElementById('purchases-h')?.scrollIntoView({ block: 'start' }); }
  else if (a === 'pol-new') { state.policyDraft = { type: 'Health', people: [], documents: [] }; state.policyErrors = {}; render(); document.getElementById('pol-form')?.scrollIntoView({ block: 'start' }); document.getElementById('p-insurer')?.focus(); }
  else if (a === 'pol-edit') { const x = state.policies.find((p) => p.id === id); state.policyDraft = { ...x, people: peopleOf(x), documents: (x.documents || []).map((d) => ({ ...d })) }; state.policyErrors = {}; render(); document.getElementById('pol-form')?.scrollIntoView({ block: 'start' }); }
  else if (a === 'pol-cancel') { state.policyDraft = null; state.policyErrors = {}; render(); }
  else if (a === 'pol-toggle') { state.policyOpen = state.policyOpen === id ? null : id; state.policyConfirmDel = null; render(); }
  else if (a === 'pol-del') { state.policyConfirmDel = id; render(); }
  else if (a === 'pol-del-no') { state.policyConfirmDel = null; render(); }
  else if (a === 'pol-del-yes') deletePolicy(id);
  else if (a === 'pol-add-doc') { state.policyDraft = readPolicyForm(); state.policyDraft.documents.push({ kind: DOC_KINDS[0], label: '', url: '' }); render(); }
  else if (a === 'pol-rm-doc') { state.policyDraft = readPolicyForm(); state.policyDraft.documents.splice(Number(t.dataset.i), 1); render(); }
  else if (a === 'pol-add-member') addMemberFromPolicy();
  else if (a === 'veh-new') { state.vehicleDraft = { type: 'car' }; state.vehicleErrors = {}; render(); document.getElementById('veh-form')?.scrollIntoView({ block: 'center' }); document.getElementById('v-name')?.focus(); }
  else if (a === 'veh-edit') { state.vehicleDraft = { ...vehicleById(id) }; state.vehicleErrors = {}; render(); document.getElementById('veh-form')?.scrollIntoView({ block: 'center' }); }
  else if (a === 'veh-cancel') { state.vehicleDraft = null; state.vehicleErrors = {}; render(); }
  else if (a === 'veh-archive') saveVehicle({ status: 'archived' });
  else if (a === 'spend-vehicle') {
    const fromOthers = state.tab === 'others';
    state.spendVehicle = fromOthers ? id : (state.spendVehicle === id ? null : id); state.purchaseLimit = 10;
    if (fromOthers) state.tab = 'spends';
    render();
    if (state.spendVehicle) document.getElementById('purchases-h')?.scrollIntoView({ block: 'start', behavior: fromOthers ? 'auto' : 'smooth' });
  }
  else if (a === 'wallet-filter') { const f = t.dataset.f; state.walletFilter = state.walletFilter === f ? null : f; render(); }
  else if (a === 'spend-period') { state.spendPeriod = t.dataset.p; state.spendDay = null; state.purchaseLimit = 10; render(); }
  else if (a === 'spend-day') { const d = t.dataset.day; state.spendDay = state.spendDay === d ? null : d; state.purchaseLimit = 10; render(); if (state.spendDay) document.getElementById('purchases-h')?.scrollIntoView({ block: 'start', behavior: 'smooth' }); }

  else if (a === 'more-purchases') { state.purchaseLimit += 10; render(); }
});

$app.addEventListener('submit', async (ev) => {
  if (ev.target.id === 'ask-form') { ev.preventDefault(); runAsk(document.getElementById('ask-q').value); return; }
  if (ev.target.id === 'log-form') { ev.preventDefault(); savePurchase(false); return; }
  if (ev.target.id === 'veh-form') { ev.preventDefault(); saveVehicle(); return; }
  if (ev.target.id === 'pol-form') { ev.preventDefault(); savePolicy(); return; }
  if (ev.target.id === 'app-form') { ev.preventDefault(); saveAppliance(); return; }
  if (ev.target.id === 'pay-form') { ev.preventDefault(); savePayment(); return; }
  if (ev.target.id === 'loan-form') { ev.preventDefault(); saveLoan(); return; }
  if (ev.target.id === 'mem-form') { ev.preventDefault(); saveMember(); return; }
  if (ev.target.id !== 'card-form') return;
  ev.preventDefault();
  if (state.busy) return;
  const draft = readForm(ev.target);
  if (!state.db) { state.formDraft = draft; state.formErrors = { _form: 'Saving is not available in this view.' }; return render(); }
  state.busy = true;
  try {
    const r = await saveCard(draft);
    if (!r.ok) { state.formDraft = draft; state.formErrors = r.errors; }
    else { state.editing = null; state.formDraft = null; state.formErrors = {}; state.open = r.card.id; toast(draft.id ? 'Card updated' : 'Card added'); }
  } catch (e) { state.formDraft = draft; state.formErrors = { _form: friendly(e) }; }
  state.busy = false;
  render();
  document.querySelector('.ferr, #card-form .box.bad')?.scrollIntoView({ block: 'center' });
});

// Purchase search: filter as you type, keeping the cursor in the box.
function renderKeepingSearch() {
  const el = document.getElementById('p-search');
  const pos = el ? [el.selectionStart, el.selectionEnd] : null;
  render();
  const again = document.getElementById('p-search');
  if (again && pos) { again.focus(); try { again.setSelectionRange(pos[0], pos[1]); } catch (e) {} }
}
$app.addEventListener('input', (ev) => {
  if (ev.target.id !== 'p-search') return;
  state.spendQuery = ev.target.value; state.purchaseLimit = 10; renderKeepingSearch();
});

// Keep what the person is typing when live updates arrive.
function safeRender() {
  if (state.askResult && state.askText) { const wallet = state.cards.filter((c) => c.status === 'active').map((c) => ({ card: c, pack: activePack(c.id)?.pack || null })); const q = state.askResult.query; state.askResult = state.askResult.needs ? state.askResult : recommend(wallet, q, today()); }
  const f = document.activeElement;
  if (f && f.id === 'p-search') return renderKeepingSearch();
  if (f && f.closest && (f.closest('#card-form') || f.closest('#log-form') || f.closest('#veh-form') || f.closest('#pol-form') || f.closest('#app-form') || f.closest('#pay-form') || f.closest('#loan-form') || f.closest('#mem-form') || f.id === 'pack-text' || f.id === 'ask-q')) return;
  render();
}

render();

(async () => {
  if (!window.claude || !window.claude.use) { state.ready = { cards: true, rulePacks: true, months: true, vehicles: true, policies: true, appliances: true, billPayments: true, loans: true, family: true }; state.loadErr = 'Saving is not available in this view.'; return render(); }
  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  if (user) { try { const w = await user.can('data.write'); state.canWrite = w !== false; } catch (e) {} }
  if (!db) { state.ready = { cards: true, rulePacks: true, months: true, vehicles: true, policies: true, appliances: true, billPayments: true, loans: true, family: true }; state.loadErr = 'Sign in to claude.ai to see and save your cards.'; return render(); }
  state.db = db;
  render();
  db.collection('cards').onSnapshot((snap) => {
    state.cards = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
    state.ready.cards = true; state.loadErr = '';
    if (state.open && !state.cards.some((c) => c.id === state.open)) state.open = null;
    safeRender();
  }, () => { state.ready.cards = true; state.loadErr = 'Could not load your cards. Reopen the page to try again.'; render(); });
  db.collection('rulePacks').onSnapshot((snap) => {
    state.packs = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
    state.ready.rulePacks = true;
    safeRender();
  }, () => { state.ready.rulePacks = true; });
  db.collection('settings').onSnapshot((snap) => {
    const o = snap.docs.find((d) => d.id === 'others');
    if (o && Array.isArray(o.data().order)) state.othersOrder = o.data().order;
    safeRender();
  }, () => {});
  db.collection('family').onSnapshot((snap) => {
    state.family = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
    state.ready.family = true;
    safeRender();
  }, () => { state.ready.family = true; });
  db.collection('loans').onSnapshot((snap) => {
    state.loans = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
    state.ready.loans = true;
    safeRender();
  }, () => { state.ready.loans = true; });
  db.collection('billPayments').onSnapshot((snap) => {
    state.billPayments = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
    state.ready.billPayments = true;
    safeRender();
  }, () => { state.ready.billPayments = true; });
  db.collection('appliances').onSnapshot((snap) => {
    state.appliances = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
    state.ready.appliances = true;
    safeRender();
  }, () => { state.ready.appliances = true; });
  db.collection('policies').onSnapshot((snap) => {
    state.policies = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
    state.ready.policies = true;
    if (state.policyOpen && !state.policies.some((x) => x.id === state.policyOpen)) state.policyOpen = null;
    safeRender();
  }, () => { state.ready.policies = true; });
  db.collection('vehicles').onSnapshot((snap) => {
    state.vehicles = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
    state.ready.vehicles = true;
    safeRender();
  }, () => { state.ready.vehicles = true; });
  db.collection('purchaseMonths').onSnapshot((snap) => {
    state.months = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
    state.ready.months = true;
    safeRender();
  }, () => { state.ready.months = true; state.loadErr = 'Could not load your purchases. Reopen the page to try again.'; render(); });
})();
