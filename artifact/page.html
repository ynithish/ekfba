/** A collapsible Others section: header with a one-line summary; body only when open. */
const OTHERS_SECTIONS = ['subs', 'loans', 'vehicles', 'appliances', 'family', 'policies'];
const OTHERS_TITLE = { subs: 'Subscriptions', loans: 'Debts', vehicles: 'Vehicles', appliances: 'Appliances & devices', family: 'Family members', policies: 'Insurances' };
/** The saved section order, with any section it doesn't know about added at the end. */
function othersOrder() {
  const saved = (state.othersOrder || []).filter((k) => OTHERS_SECTIONS.includes(k));
  return [...new Set([...saved, ...OTHERS_SECTIONS])];
}
async function moveSection(key, dir) {
  const order = othersOrder();
  const i = order.indexOf(key), j = i + dir;
  if (i < 0 || j < 0 || j >= order.length) return;
  [order[i], order[j]] = [order[j], order[i]];
  state.othersOrder = order; render();
  document.querySelector(`[data-action=move-sec][data-k="${key}"][data-dir="${dir}"]`)?.focus();
  try { if (state.db) await state.db.collection('settings').doc('others').set({ order, updatedAt: Date.now() }); }
  catch (e) { toast('Could not save the new order.'); }
}

/** A collapsible Others section: header with a one-line summary; body only when open. In reorder mode, up/down arrows instead. */
function accordion(key, title, summary, attention, body, forceOpen) {
  const order = othersOrder();
  const i = order.indexOf(key);
  if (state.reordering) {
    return html`<section class="acc reordering">
      <div class="acc-head" id="${key}-h">
        <span class="acc-title">${title}</span>
        <span class="move-btns">
          <button class="btn ghost small" data-action="move-sec" data-k="${key}" data-dir="-1" ${i === 0 ? 'disabled' : ''} aria-label="Move ${title} up">↑</button>
          <button class="btn ghost small" data-action="move-sec" data-k="${key}" data-dir="1" ${i === order.length - 1 ? 'disabled' : ''} aria-label="Move ${title} down">↓</button>
        </span>
      </div></section>`;
  }
  const open = forceOpen || !!state.othersOpen[key];
  return html`<section class="acc ${open ? 'open' : ''}">
    <button class="acc-head" id="${key}-h" data-action="acc" data-k="${key}" aria-expanded="${open}">
      <span class="acc-title">${title}</span>
      <span class="acc-sum ${attention ? 'attn' : ''}">${summary}</span>
      <svg class="chev" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    ${open ? html`<div class="acc-body">${body()}</div>` : ''}
  </section>`;
}

  state.busy = true; render();
  try {
    await state.db.collection('appliances').doc(r.item.id).set(r.item);
    state.applianceDraft = null; state.applianceErrors = {};
    if (r.item.status === 'archived' && state.spendAppliance === r.item.id) state.spendAppliance = null;
    toast(r.item.status === 'archived' ? `${r.item.name} archived` : existing ? 'Saved' : `${r.item.name} added`);
  } catch (e) { state.applianceErrors = { _form: friendly(e) }; }
  state.busy = false; render();
}

/** Subscriptions: one row per repeating spend, from its latest purchase, with the next due date. */
function subscriptionsView(ps) {
  const t = today();
  const subs = subscriptionsFrom(ps);
  const m = subscriptionMonthSummary(ps, t);
  const monthName = new Date(t + 'T00:00:00').toLocaleDateString('en-IN', { month: 'short' });
  return html`${m.includesNonMonthly ? html`<p class="hint due-odd-note">The due amount is in orange because it includes a payment that doesn't repeat every month (for example quarterly, yearly or every 7 months), so it applies to ${monthName} only.</p>` : ''}
    ${!subs.length ? html`<div class="empty"><p>When you log a recharge, OTT plan, broadband bill or similar, tick “This repeats (subscription)” and pick how often. It shows up here with its next due date.</p></div>`
      : html`<section class="list">${subs.map((x) => {
        const days = daysBetween(t, x.nextDue);
        const [cls, label] = days < 0 ? ['st-urgent', 'Overdue'] : days <= 7 ? ['st-soon', 'Due soon'] : ['st-ok', 'On track'];
        const linked = [x.applianceId && applianceById(x.applianceId)?.name, x.vehicleId && vehicleById(x.vehicleId)?.name].filter(Boolean).join(', ');
        const c = cardById(x.cardId);
        return html`<button class="row sub-row" data-action="sub-open" data-shop="${x.merchant}">
          <div><div class="ins">${x.merchant}</div><div class="meta">${x.label}${x.variable ? ' · amount varies' : ''}${linked ? ' · ' + linked : ''} · last ${fmtShort(x.last)}${c ? ' on ' + cardLabel(c) : ''}</div></div>
          <div class="right"><span class="pill ${cls}">${label}</span><span class="when">${x.variable ? `~${formatPaise(x.averagePaise)}` : formatPaise(x.amountPaise)} · ${fmtShort(x.nextDue)} (${rel(days)})</span>
            ${x.variable && x.count > 1 ? html`<span class="when">last ${formatPaise(x.amountPaise)} · avg of last ${Math.min(3, x.count)}</span>` : ''}</div>
        </button>`; })}</section>
        <p class="hint">Next due dates are worked out from the last payment you logged. Reminders will come later.</p>`}`;
}

function policiesView() {
  const t = today();
  const all = sortPolicies(state.policies);
  const shown = all;
  const daysTo = (x) => (x.renewalDate ? daysBetween(t, x.renewalDate) : null);
  const soon = all.filter((x) => { const d = daysTo(x); return d !== null && d >= 0 && d <= 60; }).length;
  const overdue = all.filter((x) => { const d = daysTo(x); return d !== null && d < 0; }).length;
  return html`${state.canWrite && !state.policyDraft ? html`<div class="acc-actions"><button class="btn ghost small" data-action="pol-new">Add policy</button></div>` : ''}
    ${state.policyDraft ? policyForm() : ''}
    ${all.length ? html`<p class="meta">${all.length} polic${all.length === 1 ? 'y' : 'ies'} · ${soon} renew${soon === 1 ? 's' : ''} in 60 days${overdue ? ` · ${overdue} overdue` : ''}</p>` : ''}
    ${!state.ready.policies ? html`<div class="empty"><p>Loading policies…</p></div>`
      : !all.length ? (state.policyDraft ? '' : html`<div class="empty"><p>Add the insurer, type, who is covered and the renewal date. Status colours and calendar reminders follow from that.</p></div>`)
      : html`<section class="list" aria-label="Insurances">${shown.map((x) => policyRow(x, t))}</section>`}
    <p class="hint">Keep policy numbers out of this page. Document links open in Google Drive.</p>`;
}

    <div class="right"><span class="pill ${PILL[st.key]}">${st.label}</span><span class="when">${x.renewalDate ? fmtDate(x.renewalDate) : '-'}${days !== null ? ' · ' + rel(days) : ''}</span></div></button>
    ${open ? html`<div class="detail"><dl class="kv">
        <dt>Type</dt><dd>${x.type}</dd>
        ${veh ? html`<dt>Vehicle</dt><dd>${veh.name}</dd>` : ''}

function readPolicyForm() {
  const f = Object.fromEntries(new FormData(document.getElementById('pol-form')));
  const docs = (state.policyDraft.documents || []).map((_, i) => ({ kind: f['dkind' + i], label: f['dlabel' + i], url: f['durl' + i] }));
  const type = f.type === '__new__' ? String(f.newType || '').trim() || '__new__' : f.type;
  const people = new FormData(document.getElementById('pol-form')).getAll('person');
  return { ...state.policyDraft, insurer: f.insurer, type, people, renewalDate: f.renewalDate, coverage: f.coverage, comments: f.comments,
    vehicleId: type === 'Motor' ? (f.vehicleId || null) : null, documents: docs };
}

async function savePolicy() {
  if (state.busy || !state.db) return;
  const draft = readPolicyForm();
  // Ignore blank document rows the person added but never filled.
  draft.documents = draft.documents.filter((x) => String(x.url || '').trim() || String(x.label || '').trim());
  const existing = draft.id ? state.policies.find((x) => x.id === draft.id) : null;
  const r = validatePolicy({ ...draft, type: draft.type === '__new__' ? '' : draft.type, id: draft.id || uuid() }, existing);
  if (!r.ok) { state.policyDraft = draft; state.policyErrors = r.errors; return render(); }
  state.busy = true; render();
  try {
    await state.db.collection('policies').doc(r.policy.id).set(r.policy);
    state.policyDraft = null; state.policyErrors = {}; state.policyOpen = r.policy.id;
    toast(existing ? 'Policy updated' : 'Policy added');
  } catch (e) { state.policyErrors = { _form: friendly(e) }; }
  state.busy = false; render();
}

async function deletePolicy(id) {
  if (!state.db) return;
  try { await state.db.collection('policies').doc(id).delete(); state.policyOpen = null; state.policyConfirmDel = null; toast('Policy deleted'); }
  catch (e) { state.loadErr = friendly(e); }
  render();
}

/** PUC status line: expiry with a status (Overdue / Urgent within 7 days / Renews soon within 30 / On track). */
function vehiclePuc(v) {
  if (!v.puc?.expiryDate) return html`<div class="meta">PUC: not added</div>`;
  const days = daysBetween(today(), v.puc.expiryDate);
  const [cls, label] = days < 0 ? ['st-urgent', 'Expired'] : days <= 7 ? ['st-urgent', 'Expires soon'] : days <= 30 ? ['st-soon', 'Due soon'] : ['st-ok', 'Valid'];
  return html`<div class="amc-line"><span class="pill ${cls}">PUC · ${label}</span><span class="meta">${v.puc.lastDate ? `checked ${fmtDate(v.puc.lastDate)} · ` : ''}${days < 0 ? 'expired' : 'expires'} ${fmtDate(v.puc.expiryDate)} (${rel(days)})</span></div>`;
}

/** The vehicle's insurance renewal (soonest Motor policy linked to it), as a status line. */
function vehicleInsurance(v) {
  const t = today();
  const pols = state.policies.filter((x) => x.vehicleId === v.id && x.renewalDate).sort((a, b) => a.renewalDate.localeCompare(b.renewalDate));
  if (!pols.length) return html`<div class="meta">Insurance: not linked (pick this vehicle on a Motor policy)</div>`;
  const p = pols[0];
  const days = daysBetween(t, p.renewalDate);
  const st = renewalStatus(days);
  return html`<div class="amc-line"><span class="pill ${PILL[st.key]}">Insurance · ${st.label}</span><span class="meta">${p.insurer} · renews ${fmtDate(p.renewalDate)} (${rel(days)})</span></div>`;
}

/** Vehicles: spend per vehicle in the period; tap to see its purchases; add or edit vehicles. */
function vehiclesView(ps, range, periodName) {
  const vt = vehicleTotals(ps, range.start, range.end);
  const vs = activeVehicles().sort((a, b) => (vt[b.id]?.paise || 0) - (vt[a.id]?.paise || 0) || a.name.localeCompare(b.name));
  const archived = state.vehicles.filter((v) => v.status === 'archived');
  const max = Math.max(1, ...vs.map((v) => vt[v.id]?.paise || 0));
  return html`${state.canWrite && !state.vehicleDraft ? html`<div class="acc-actions"><button class="btn ghost small" data-action="veh-new">Add vehicle</button></div>` : ''}
    ${state.vehicleDraft ? vehicleForm() : ''}
    ${!state.ready.vehicles ? html`<div class="empty"><p>Loading vehicles…</p></div>`
      : !vs.length ? (state.vehicleDraft ? '' : html`<div class="empty"><p>Add your car, bike or scooter. Then, when you log fuel, a car wash, service, insurance and similar spends, tick “Is this vehicle related?” to track what each vehicle costs.</p></div>`)
      : html`<section class="list">${vs.map((v) => { const t = vt[v.id]; return html`
        <article class="row veh-row ${state.spendVehicle === v.id ? 'selected' : ''}">
          <button class="veh-main" data-action="spend-vehicle" data-id="${v.id}" aria-pressed="${state.spendVehicle === v.id}">
            <div class="spend-top"><span class="ins">${v.name} <small class="meta">${VEHICLE_TYPE_LABEL[v.type]}</small></span><span class="num">${formatPaise(t?.paise || 0)}</span></div>
            <div class="bar thin"><span style="width:${Math.round(((t?.paise || 0) * 100) / max)}%"></span></div>
            <div class="meta">${t ? `${t.count} purchase${t.count === 1 ? '' : 's'} · Fuel ${formatPaise(t.fuelPaise)} · Other ${formatPaise(t.paise - t.fuelPaise)}` : 'No spends'} ${periodName} · tap to see purchases</div>
            ${vehicleInsurance(v)}
            ${vehiclePuc(v)}
          </button>
          ${state.canWrite ? html`<button class="btn ghost small" data-action="veh-edit" data-id="${v.id}" aria-label="Edit ${v.name}">Edit</button>` : ''}
          ${v.rc || v.puc?.url ? html`<div class="veh-docs meta">
            ${v.rc ? html`<span>RC${v.rc.number ? ' ' + v.rc.number : ''}${v.rc.validUntil ? ` · valid till ${fmtDate(v.rc.validUntil)}` : ''}</span>${v.rc.url ? html`<a href="${v.rc.url}" target="_blank" rel="noopener">View RC</a>` : ''}` : ''}
            ${v.puc?.url ? html`<a href="${v.puc.url}" target="_blank" rel="noopener">View PUC certificate</a>` : ''}
          </div>` : ''}
        </article>`; })}</section>`}
    ${archived.length ? html`<p class="hint">${archived.length} archived vehicle${archived.length === 1 ? '' : 's'} hidden; their past purchases are kept.</p>` : ''}`;
}

async function saveVehicle(patch = {}) {
  if (state.busy || !state.db) return;
  const f = Object.fromEntries(new FormData(document.getElementById('veh-form')));
  const draft = { ...state.vehicleDraft, name: f.name, type: f.type, notes: f.notes,
    rc: { number: f.rcNumber, validUntil: f.rcValid, url: f.rcUrl }, puc: { lastDate: f.pucLast, expiryDate: f.pucExpiry, url: f.pucUrl }, ...patch };
  const existing = draft.id ? vehicleById(draft.id) : null;
  const r = validateVehicle({ ...draft, id: draft.id || uuid() }, existing);
  if (!r.ok) { state.vehicleDraft = draft; state.vehicleErrors = r.errors; return render(); }
  state.busy = true; render();
  try {
    await state.db.collection('vehicles').doc(r.vehicle.id).set(r.vehicle);
    state.vehicleDraft = null; state.vehicleErrors = {};
    if (r.vehicle.status === 'archived' && state.spendVehicle === r.vehicle.id) state.spendVehicle = null;
    toast(r.vehicle.status === 'archived' ? `${r.vehicle.name} archived` : existing ? 'Vehicle updated' : `${r.vehicle.name} added`);
  } catch (e) { state.vehicleErrors = { _form: friendly(e) }; }
  state.busy = false; render();
}

function freshView() {
  const active = state.cards.filter((c) => c.status === 'active' && c.kind !== 'other');
  if (!active.length) return html`<div class="empty"><p>Add cards to see how fresh their rules are.</p></div>`;
  return html`<p class="hint">Offers are marked out of date 30 days after the bank pages were last checked, other rules after 180 days. To refresh, share the card's pages in the Card Manager project chat and ask for an updated rule pack.</p>
    <section class="list">${active.map((c) => {
      const rec = activePack(c.id);
      if (!rec) return html`<article class="row"><div class="row-head"><div><div class="ins">${cardLabel(c)}</div><div class="meta">${c.sourceUrls.length} official link${c.sourceUrls.length === 1 ? '' : 's'} saved</div></div><div class="right"><span class="pill st-soon">No rules</span></div></div></article>`;
      const fr = packFreshness(rec.pack, today());
      const pill = fr.baselineStale ? ['st-urgent', 'Out of date'] : fr.offersStale ? ['st-soon', 'Offers out of date'] : ['st-ok', 'Fresh'];
      return html`<article class="row"><div class="row-head"><div><div class="ins">${cardLabel(c)}</div>
        <div class="meta">Checked ${fmtDate(rec.pack.checkedAt)} (${rel(-fr.ageDays)}) · version ${rec.version}${fr.unverifiedCount ? ` · ${fr.unverifiedCount} unverified` : ''}</div>
        <div class="meta">${rec.pack.sources.map((s, i) => html`${i ? ' · ' : ''}${s.url ? html`<a href="${s.url}" target="_blank" rel="noopener">${s.title}</a>` : s.title}`)}</div></div>
        <div class="right"><span class="pill ${pill[0]}">${pill[1]}</span></div></div></article>`;
    })}</section>`;
}

/* ---------------- Events ---------------- */

function afterRender() {
  document.getElementById('pack-file')?.addEventListener('change', async (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    if (file.size > 300000) { toast('That file is too large for a rule pack.'); return; }
    checkPack(state.importing, await file.text());
  });
  const shop = document.getElementById('l-merchant');
  const pickCategory = () => {

$app.addEventListener('submit', async (ev) => {
  if (ev.target.id === 'ask-form') { ev.preventDefault(); runAsk(document.getElementById('ask-q').value); return; }
  if (ev.target.id === 'log-form') { ev.preventDefault(); savePurchase(false); return; }
  if (ev.target.id === 'veh-form') { ev.preventDefault(); saveVehicle(); return; }
  if (ev.target.id === 'pol-form') { ev.preventDefault(); savePolicy(); return; }
  if (ev.target.id === 'app-form') { ev.preventDefault(); saveAppliance(); return; }
  if (ev.target.id === 'pay-form') { ev.preventDefault(); savePayment(); return; }
  if (ev.target.id === 'loan-form') { ev.preventDefault(); saveLoan(); return; }
  if (ev.target.id === 'mem-form') { ev.preventDefault(); saveMember(); return; }
  if (ev.target.id !== 'card-form') return;
  ev.preventDefault();
  if (state.busy) return;
  const draft = readForm(ev.target);
  if (!state.db) { state.formDraft = draft; state.formErrors = { _form: 'Saving is not available in this view.' }; return render(); }
  state.busy = true;
  try {
    const r = await saveCard(draft);
    if (!r.ok) { state.formDraft = draft; state.formErrors = r.errors; }
    else { state.editing = null; state.formDraft = null; state.formErrors = {}; state.open = r.card.id; toast(draft.id ? 'Card updated' : 'Card added'); }
  } catch (e) { state.formDraft = draft; state.formErrors = { _form: friendly(e) }; }
  state.busy = false;
  render();
  document.querySelector('.ferr, #card-form .box.bad')?.scrollIntoView({ block: 'center' });
});

// Purchase search: filter as you type, keeping the cursor in the box.
function renderKeepingSearch() {
  const el = document.getElementById('p-search');
  const pos = el ? [el.selectionStart, el.selectionEnd] : null;
  render();
  const again = document.getElementById('p-search');
  if (again && pos) { again.focus(); try { again.setSelectionRange(pos[0], pos[1]); } catch (e) {} }
}

});

// Keep what the person is typing when live updates arrive.
function safeRender() {
  if (state.askResult && state.askText) { const wallet = state.cards.filter((c) => c.status === 'active').map((c) => ({ card: c, pack: activePack(c.id)?.pack || null })); const q = state.askResult.query; state.askResult = state.askResult.needs ? state.askResult : recommend(wallet, q, today()); }
  const f = document.activeElement;
  if (f && f.id === 'p-search') return renderKeepingSearch();
  if (f && f.closest && (f.closest('#card-form') || f.closest('#log-form') || f.closest('#veh-form') || f.closest('#pol-form') || f.closest('#app-form') || f.closest('#pay-form') || f.closest('#loan-form') || f.closest('#mem-form') || f.id === 'pack-text' || f.id === 'ask-q')) return;
  render();
}

  db.collection('vehicles').onSnapshot((snap) => {
    state.vehicles = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
    state.ready.vehicles = true;
    safeRender();
  }, () => { state.ready.vehicles = true; });
  db.collection('purchaseMonths').onSnapshot((snap) => {
    state.months = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
    state.ready.months = true;
    safeRender();
  }, () => { state.ready.months = true; state.loadErr = 'Could not load your purchases. Reopen the page to try again.'; render(); });
})();
</script>
